async function salvarLanc() {
  const data  = document.getElementById('fData').value;
  const desc  = document.getElementById('fDesc').value.trim();
  const valor = parseCur(document.getElementById('fValor').value);
  if (!data)       { toast('⚠️ Data obrigatória');       return; }
  if (!desc)       { toast('⚠️ Descrição obrigatória');  return; }
  if (!valor || valor <= 0) { toast('⚠️ Valor inválido'); return; }

  const grp   = document.getElementById('fGrp').value;
  const isReceita = grp === 'Receita';
  const pagoEl = document.getElementById('fPago');
  const payload = {
    data,
    descricao:  desc,
    valor,
    tipo:       isReceita ? 'receita' : 'despesa',
    conta:      document.getElementById('fConta').value  || null,
    cat:        document.getElementById('fCat').value    || null,
    sub:        document.getElementById('fSub').value    || null,
    banco:      document.getElementById('fBanco').value  || null,
    obs:        document.getElementById('fObs').value.trim() || null,
    etiquetas:  lancTags.concat(lancFixVar ? [lancFixVar] : []),
    pago:       isReceita ? (pagoEl ? pagoEl.checked : true) : true,
    updated_at: new Date().toISOString()
  };

  let error;
  if (editLancId) {
    ({ error } = await db().from('lancamentos').update(payload).eq('id', editLancId));
  } else {
    ({ error } = await db().from('lancamentos').insert(payload));
  }
  if (error) { toast('❌ Erro: ' + error.message); return; }
  if (!editLancId) saveFmsCtx(payload);
  toast(editLancId ? '✅ Atualizado' : '✅ Lançamento criado');
  closeLancModal();
  await carregarLancamentos();
  renderLanc();
}

async function excluirLanc() {
  if (!editLancId || !confirm('Excluir este lançamento?')) return;
  const { error } = await db().from('lancamentos').delete().eq('id', editLancId);
  if (error) { toast('❌ Erro: ' + error.message); return; }
  toast('🗑️ Lançamento excluído');
  closeLancModal();
  await carregarLancamentos();
  renderLanc();
}

  const cats = finConfig.cats || {};

async function salvarCat() {
  const emp  = document.getElementById('fCatEmp').value;
  const grp  = document.getElementById('fCatGrp').value;
  const nome = document.getElementById('fCatNome').value.trim();
  const subsRaw = document.getElementById('fCatSubs').value;
  if (!nome) { toast('⚠️ Nome obrigatório'); return; }

  const subs = subsRaw.split('\n').map(s => s.trim()).filter(Boolean);
  if (!finConfig.cats[emp])      finConfig.cats[emp] = {};
  if (!finConfig.cats[emp][grp]) finConfig.cats[emp][grp] = {};

  if (editCatKey) {
    const oldCat = editCatKey.split('||')[2];
    if (oldCat !== nome) delete finConfig.cats[emp][grp][oldCat];
  }

  finConfig.cats[emp][grp][nome] = subs;
  const ok = await salvarConfig();
  if (!ok) return;
  toast('✅ Categoria salva');
  closeCatModal();
  renderConfig();
}

async function excluirCat() {
  if (!editCatKey || !confirm('Excluir esta categoria?')) return;
  const parts = editCatKey.split('||');
  delete finConfig.cats[parts[0]][parts[1]][parts[2]];
  const ok = await salvarConfig();
  if (!ok) return;
  toast('🗑️ Categoria excluída');
  closeCatModal();
  renderConfig();
}

async function addBanco() {
  const nome = prompt('Nome do banco/conta:');
  if (!nome || !nome.trim()) return;
  const n = nome.trim();
  if (!finConfig.banks) finConfig.banks = [];
  if (finConfig.banks.includes(n)) { toast('Já existe'); return; }
  finConfig.banks.push(n);
  const ok = await salvarConfig();
  if (!ok) return;
  toast('✅ Banco adicionado');
  renderConfig();
}

async function removerBanco(idx) {
  if (!confirm('Remover "' + finConfig.banks[idx] + '"?')) return;
  finConfig.banks.splice(idx, 1);
  const ok = await salvarConfig();
  if (!ok) return;
  toast('🗑️ Banco removido');
  renderConfig();
}

// ── Migração v1 → v2 ─────────────────────────────────────────────────────────
function verificarMigracao() {
  try {
    const raw = localStorage.getItem('aos_fin');
    if (!raw) return;
    const dados = JSON.parse(raw);
    if (Array.isArray(dados) && dados.length > 0 && lancamentos.length === 0 && !window._configId) {
      document.getElementById('btnMigrar').style.display = '';
    }
  } catch (e) { /* nada */ }
}

async function migrarDados() {
  let finV1 = [], catsV1 = {}, banksV1 = [];
  try {
    finV1   = JSON.parse(localStorage.getItem('aos_fin')     || '[]');
    catsV1  = JSON.parse(localStorage.getItem('aos_fincats') || '{}');
    banksV1 = JSON.parse(localStorage.getItem('aos_banks')   || '[]');
  } catch (e) { toast('❌ Erro ao ler dados do v1'); return; }

  if (!confirm('Migrar ' + finV1.length + ' lançamentos + categorias + bancos do v1?')) return;

  // 1. Config
  finConfig.cats  = catsV1;
  finConfig.banks = banksV1;
  const okConfig = await salvarConfig();
  if (!okConfig) return;

  // 2. Lançamentos
  const registros = finV1.map(l => ({
    data:       l.data || todayStr(),
    descricao:  l.desc || l.descricao || '(sem descrição)',
    valor:      parseFloat(l.valor) || 0,
    tipo:       l.tipo === 'receita' ? 'receita' : 'despesa',
    conta:      l.conta   || l.empresa || null,
    cat:        l.cat     || null,
    sub:        l.sub     || l.subcat  || null,
    banco:      l.banco   || null,
    obs:        l.obs     || null,
  })).filter(l => l.valor > 0);

  const BATCH = 50;
  let erros = 0;
  for (let i = 0; i < registros.length; i += BATCH) {
    const { error } = await db().from('lancamentos').insert(registros.slice(i, i + BATCH));
    if (error) { erros++; console.error(error); }
  }

  if (erros > 0) toast('⚠️ Migração com ' + erros + ' erro(s)');
  else toast('✅ ' + registros.length + ' lançamentos migrados!');

  document.getElementById('btnMigrar').style.display = 'none';
  await Promise.all([carregarLancamentos(), carregarConfig()]);
  if (currentTab === 'lanc')   renderLanc();
  if (currentTab === 'config') renderConfig();
}

    // Seção Gráficos (10.4) — sempre por último, o alternador Mês/Ano só afeta esta seção

      '<div class="sec-hdr">' +

// Quick entry helpers
function qdGrps() {
  const conta = document.getElementById('qdConta')?.value;
  const grps  = Object.keys((finConfig.cats||{})[conta]||{});
  const el    = document.getElementById('qdGrp');
  if (el) { el.innerHTML = grps.map(g => '<option>' + g + '</option>').join(''); qdCats(); }
}
function qdCats() {
  const conta = document.getElementById('qdConta')?.value;
  const grp   = document.getElementById('qdGrp')?.value;
  const cats  = Object.keys(((finConfig.cats||{})[conta]||{})[grp]||{});
  const el    = document.getElementById('qdCat');
  if (el) { el.innerHTML = cats.map(c => '<option>' + c + '</option>').join(''); qdSubs(); }
  // "Já recebido" só faz sentido para Receita
  const pagoRow = document.getElementById('qdPagoRow');
  if (pagoRow) pagoRow.style.display = grp === 'Receita' ? '' : 'none';
}
function qdSubs() {
  const conta = document.getElementById('qdConta')?.value;
  const grp   = document.getElementById('qdGrp')?.value;
  const cat   = document.getElementById('qdCat')?.value;
  const subs  = (((finConfig.cats||{})[conta]||{})[grp]||{})[cat] || [];
  const el    = document.getElementById('qdSub');
  if (el) el.innerHTML = ['<option value="">— opcional —</option>', ...subs.map(s => '<option>' + s + '</option>')].join('');
}

// Etiquetas do Lançamento rápido (mesmo padrão do modal completo, ids qd* em vez de f*)
function renderQdTagsUI() {
  const box = document.getElementById('qdTagsBox');
  if (box) box.innerHTML = qdTags.length
    ? qdTags.map((t, i) => '<span class="etq-chip">' + impEsc(t) + ' <span class="x" onclick="qdRemoveTag(' + i + ')">×</span></span>').join('')
    : '<span class="config-empty-sub">nenhuma etiqueta</span>';
  const dl = document.getElementById('qdTagList');
  if (dl) dl.innerHTML = etiquetaSugestoes().filter(t => !qdTags.includes(t)).map(t => '<option value="' + impEsc(t) + '">').join('');
  const seg = document.getElementById('qdFixVarSeg');
  if (seg) seg.innerHTML = ['Fixo', 'Variável', '—'].map(v => {
    const val = v === '—' ? '' : v;
    return '<span class="' + (qdFixVar === val ? 'on' : '') + '" onclick="qdSetFixVar(\'' + val + '\')">' + v + '</span>';
  }).join('');
}
function qdTagKey(e) {
  if (e.key === 'Enter') { e.preventDefault(); qdAddTag(e.target.value); e.target.value = ''; }
}
function qdAddTag(v) {
  const t = (v || '').trim();
  if (!t || qdTags.includes(t) || ETIQ_FIXVAR.includes(t)) return;
  qdTags.push(t);
  renderQdTagsUI();
}
function qdRemoveTag(i) { qdTags.splice(i, 1); renderQdTagsUI(); }
function qdSetFixVar(v) { qdFixVar = (qdFixVar === v) ? '' : v; renderQdTagsUI(); }

async function qdSalvar() {
  const desc  = document.getElementById('qdDesc').value.trim();
  const valor = parseCur(document.getElementById('qdValor').value);
  if (!desc || !valor || valor <= 0) { toast('⚠️ Preencha descrição e valor'); return; }
  const grp = document.getElementById('qdGrp').value;
  const isReceita = grp === 'Receita';
  const pagoEl = document.getElementById('qdPago');
  const payload = {
    data:      document.getElementById('qdData').value || todayStr(),
    descricao: desc,
    valor,
    tipo:      isReceita ? 'receita' : 'despesa',
    conta:     document.getElementById('qdConta').value || null,
    cat:       document.getElementById('qdCat').value   || null,
    sub:       document.getElementById('qdSub').value   || null,
    banco:     document.getElementById('qdBanco').value || null,
    obs:       document.getElementById('qdObs').value.trim() || null,
    etiquetas: qdTags.concat(qdFixVar ? [qdFixVar] : []),
    pago:      isReceita ? (pagoEl ? pagoEl.checked : true) : true,
    updated_at: new Date().toISOString()
  };
  const { error } = await db().from('lancamentos').insert(payload);
  if (error) { toast('❌ Erro: ' + error.message); return; }
  toast('✅ Lançamento salvo');
  document.getElementById('qdDesc').value  = '';
  document.getElementById('qdValor').value = '';
  document.getElementById('qdObs').value   = '';
  document.getElementById('qdData').value  = todayStr();
  qdTags   = [];
  qdFixVar = '';
  await carregarLancamentos();
  renderDash();
}

// ── Gráficos do Dashboard (10.4) ────────────────────────────────────────────────
function fmsUltimosMeses(n) {
  const arr = [];
  const base = new Date();
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(base.getFullYear(), base.getMonth() - i, 1);
    arr.push({ y: d.getFullYear(), m: d.getMonth() });
  }
  return arr;
}
function fmsSomaMes(y, m, tipo) {
  return lancamentos
    .filter(l => !l.transferencia && l.tipo === tipo && (() => { const p = (l.data||'').split('-'); return parseInt(p[0]) === y && parseInt(p[1]) - 1 === m; })())
    .reduce((a,l) => a + Number(l.valor||0), 0);
}
function fmsDespesasPorCategoria(filtroFn) {
  const grupos = {};
  lancamentos.filter(l => !l.transferencia && l.tipo === 'despesa' && filtroFn(l)).forEach(l => {
    const k = l.cat || 'Sem categoria';
    grupos[k] = (grupos[k] || 0) + Number(l.valor||0);
  });
  const total    = Object.values(grupos).reduce((a,v) => a+v, 0);
  const entradas = Object.entries(grupos).sort((a,b) => b[1]-a[1]);
  const cores    = ['var(--accent)','var(--warn)','var(--success)','var(--info)'];
  const top      = entradas.slice(0,4).map((e,i) => ({ n: e[0], val: e[1], c: cores[i] }));
  const restoVal = entradas.slice(4).reduce((a,e) => a+e[1], 0);
  if (restoVal > 0) top.push({ n: 'Outros', val: restoVal, c: 'var(--muted)' });
  return { total, itens: top };
}
function fmsPieHtml(pie) {
  if (!pie.total) return '<div class="fms-empty">Sem despesas no período.</div>';
  return pie.itens.map(it => {
    const pct = Math.round((it.val / pie.total) * 100);
    return '<div class="fmsd-pie-row"><div class="fmsd-pie-dot" style="background:' + it.c + '"></div><div class="fmsd-pie-name">' + it.n + '</div><div class="fmsd-pie-val">' + pct + '%</div></div>';
  }).join('');
}
function fmsSaldoSvg(pontos) {
  if (pontos.length < 2) return '<div class="fms-empty">Ainda não há dados suficientes.</div>';
  const min = Math.min(...pontos), max = Math.max(...pontos);
  const range = (max - min) || 1;
  const w = 600, h = 70, pad = 6;
  const step = w / (pontos.length - 1);
  const coords = pontos.map((v,i) => {
    const x = Math.round(i * step);
    const y = Math.round(h - pad - ((v - min) / range) * (h - pad*2));
    return x + ',' + y;
  }).join(' ');
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:70px" preserveAspectRatio="none"><polyline points="' + coords + '" fill="none" stroke="var(--accent)" stroke-width="2"/></svg>';
}

function setFmsGrafModo(modo) {
  fmsGrafModo = modo;
  document.getElementById('fmsGrafBtnMes')?.classList.toggle('on', modo === 'mes');
  document.getElementById('fmsGrafBtnAno')?.classList.toggle('on', modo === 'ano');
  renderFmsGraf(modo);
}

function renderFmsGraf(modo) {
  const body = document.getElementById('fmsGrafBody');
  if (!body) return;
  const now = new Date();
  const cy  = now.getFullYear(), cm = now.getMonth(), ly = cy - 1;

  let barTitle, bars, barLabels, pieTitle, pie, saldoPontos, ytdHtml = '';

  if (modo === 'ano') {
    const mesesAno    = Array.from({ length: cm + 1 }, (_, i) => i); // jan..mês atual, mesmo período nos 2 anos
    const recAno      = mesesAno.reduce((a,m) => a + fmsSomaMes(cy, m, 'receita'), 0);
    const despAno     = mesesAno.reduce((a,m) => a + fmsSomaMes(cy, m, 'despesa'), 0);
    const recAnoAnt   = mesesAno.reduce((a,m) => a + fmsSomaMes(ly, m, 'receita'), 0);
    const despAnoAnt  = mesesAno.reduce((a,m) => a + fmsSomaMes(ly, m, 'despesa'), 0);
    const barMax      = Math.max(1, recAno, despAno, recAnoAnt, despAnoAnt);
    bars       = [
      { r: Math.round(recAnoAnt/barMax*100), d: Math.round(despAnoAnt/barMax*100) },
      { r: Math.round(recAno/barMax*100),    d: Math.round(despAno/barMax*100) }
    ];
    barLabels  = [String(ly), String(cy)];
    barTitle   = 'Receita x despesa — ' + cy + ' vs ' + ly;
    pieTitle   = 'Despesas por categoria — ano de ' + cy;
    pie        = fmsDespesasPorCategoria(l => { const p = (l.data||'').split('-'); return parseInt(p[0]) === cy && parseInt(p[1]) - 1 <= cm; });
    let acc = 0;
    saldoPontos = mesesAno.map(m => (acc += (fmsSomaMes(cy, m, 'receita') - fmsSomaMes(cy, m, 'despesa'))));
    const pct = recAnoAnt ? Math.round(((recAno - recAnoAnt) / recAnoAnt) * 100) : null;
    const arrowHtml = pct === null ? '' : '<span class="' + (pct >= 0 ? 'arrow-up' : 'arrow-down') + '">' + (pct >= 0 ? '▲' : '▼') + ' ' + Math.abs(pct) + '%</span>';
    ytdHtml = '<div class="fmsd-ytd-kpi on"><div class="k">Receita acumulada no ano (' + MONTHS[0].slice(0,3) + '–' + MONTHS[cm].slice(0,3) + ') comparada com ' + ly + '</div><div class="v">' + fmtMoeda(recAno) + ' ' + arrowHtml + '</div></div>';
  } else {
    const meses = fmsUltimosMeses(12);
    const vals  = meses.map(({y,m}) => ({ r: fmsSomaMes(y,m,'receita'), d: fmsSomaMes(y,m,'despesa') }));
    const barMax = Math.max(1, ...vals.map(v => Math.max(v.r, v.d)));
    bars      = vals.map(v => ({ r: Math.round(v.r/barMax*100), d: Math.round(v.d/barMax*100) }));
    barLabels = meses.map(({m}) => MONTHS[m].charAt(0));
    barTitle  = 'Receita x despesa — últimos 12 meses';
    pieTitle  = 'Despesas por categoria — ' + MONTHS[cm].toLowerCase();
    pie       = fmsDespesasPorCategoria(l => { const p = (l.data||'').split('-'); return parseInt(p[0]) === cy && parseInt(p[1]) - 1 === cm; });
    let acc = 0;
    saldoPontos = vals.map(v => (acc += (v.r - v.d)));
  }

  body.innerHTML =
    ytdHtml +
    '<div class="fmsd-graf-grid">' +
      '<div class="card">' +
        '<div class="card-title">' + barTitle + '</div>' +
        '<div class="fmsd-bar-chart' + (modo==='ano'?' ano':'') + '">' + bars.map(b => '<div class="fmsd-bar-pair"><div class="fmsd-bar rec" style="height:' + b.r + '%"></div><div class="fmsd-bar desp" style="height:' + b.d + '%"></div></div>').join('') + '</div>' +
        '<div class="fmsd-bar-labels' + (modo==='ano'?' ano':'') + '">' + barLabels.map(l => '<span>' + l + '</span>').join('') + '</div>' +
        '<div class="fmsd-legend"><span><i style="background:var(--success)"></i>Receita</span><span><i style="background:var(--danger)"></i>Despesa</span></div>' +
      '</div>' +
      '<div class="card">' +
        '<div class="card-title">' + pieTitle + '</div>' +
        '<div class="fmsd-pie-list">' + fmsPieHtml(pie) + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="card">' +
      '<div class="card-title">Saldo acumulado</div>' +
      fmsSaldoSvg(saldoPontos) +
    '</div>';
}

// ── Fluxo Mensal ─────────────────────────────────────────────────────────────
function renderFluxo() {
  const el = document.getElementById('sv-fluxo');
  const contas = Object.keys(finConfig.cats || {});
  const meses  = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

  const rows = meses.map((m, mi) => {
    const items   = lancamentos.filter(l => { if (l.transferencia) return false; const p = (l.data||'').split('-'); return parseInt(p[0])===fluxoYear && parseInt(p[1])-1===mi; });
    const entradas = items.filter(l => l.tipo==='receita').reduce((a,l) => a+Number(l.valor||0), 0);
    const saidas   = items.filter(l => l.tipo==='despesa').reduce((a,l) => a+Number(l.valor||0), 0);
    const byEmp    = contas.map(emp => items.filter(l => l.conta===emp && l.tipo==='despesa').reduce((a,l) => a+Number(l.valor||0), 0));
    return { m, entradas, saidas, byEmp, res: entradas - saidas };
  });

  const totE     = rows.reduce((a,r) => a+r.entradas, 0);
  const totS     = rows.reduce((a,r) => a+r.saidas,   0);
  const totByEmp = contas.map((_,ei) => rows.reduce((a,r) => a+r.byEmp[ei], 0));

  const f = v => v ? fmtMoeda(v) : '—';
  const colColor = v => v === 0 ? 'var(--muted)' : v > 0 ? 'var(--success)' : 'var(--danger)';
  const colClass = v => v === 0 ? 'col-muted' : v > 0 ? 'col-success' : 'col-danger';

  el.innerHTML =
    '<div class="year-nav">' +
      '<button class="btn btn-ghost btn-sm" onclick="fluxoYear--;renderFluxo()">◀</button>' +
      '<span class="year-label">' + fluxoYear + '</span>' +
      '<button class="btn btn-ghost btn-sm" onclick="fluxoYear++;renderFluxo()">▶</button>' +
      '<span class="year-sublabel">Fluxo de caixa anual</span>' +
    '</div>' +
    '<div class="fluxo-table-wrap"><table class="fluxo-table">' +
      '<thead><tr>' +
        '<th style="text-align:left">Mês</th>' +
        '<th>Entradas</th>' +
        '<th>Saídas</th>' +
        contas.map(e => '<th>' + e.replace('Pandora ','') + '</th>').join('') +
        '<th>Resultado</th>' +
      '</tr></thead>' +
      '<tbody>' +
        rows.map(r =>
          '<tr>' +
            '<td>' + r.m + '</td>' +
            '<td class="col-success">' + f(r.entradas) + '</td>' +
            '<td class="col-danger">'  + f(r.saidas)   + '</td>' +
            r.byEmp.map(v => '<td class="col-muted">' + f(v) + '</td>').join('') +
            '<td class="' + colClass(r.res) + '" style="font-weight:700">' + (r.entradas||r.saidas ? fmtMoeda(r.res) : '—') + '</td>' +
          '</tr>'
        ).join('') +
      '</tbody>' +
      '<tfoot><tr>' +
        '<td>Total</td>' +
        '<td class="col-success">' + fmtMoeda(totE) + '</td>' +
        '<td class="col-danger">'  + fmtMoeda(totS) + '</td>' +
        totByEmp.map(v => '<td>' + fmtMoeda(v) + '</td>').join('') +
        '<td class="' + colClass(totE-totS) + '">' + fmtMoeda(totE-totS) + '</td>' +
      '</tr></tfoot>' +
    '</table></div>' +
    (!totE && !totS ? '<div class="empty-state" style="padding:20px"><p>Nenhum lançamento em ' + fluxoYear + '.</p></div>' : '');
}

//  unificada abrirFMSRecebimento — categoria inferida + banco escolhido no mesmo lugar.)

// Paga um job em aberto usando o crédito (sessão grátis) do anfitrião Airbnb.
// Não cria lançamento (cortesia, R$ 0); o job sai de "A Receber" e fica neutro nos pontos.
async function pagarComCredito(jobId) {
  const jr = await db().from('jobs').select('*').eq('id', jobId).single();
  if (jr.error || !jr.data) { toast('❌ Job não encontrado'); return; }
  const j = jr.data;
  if (j.status === 'pago') {   // guard: já recebido/pago
    toast('⚠️ Este job já foi recebido');
    await carregarJobsPendentes();
    if (currentTab === 'cpr') renderCPR(); else renderDash();
    return;
  }
  const nome = (j.credito_para || '').trim();
  if (!nome) { toast('⚠️ Job sem "Crédito para" preenchido'); return; }
  const [aj, ap] = await Promise.all([
    db().from('jobs').select('id,status,tipo_credito,credito_para').eq('credito_para', nome),
    db().from('premios_airbnb').select('anfitriao,job_id').eq('anfitriao', nome)
  ]);
  const disp = AlexAirbnb.disponivel(nome, aj.data || [], ap.data || []);
  if (disp < 1) { toast('⚠️ ' + nome + ' não tem sessão grátis disponível ainda'); return; }
  if (!confirm('Pagar este job com o crédito de ' + nome + '?\nEle vira R$ 0, sai de "A Receber" e não soma pontos.')) return;
  const res = await AlexAirbnb.redeem(jobId, nome, j.data || todayStr(), null);
  if (res.error) { toast('❌ Erro: ' + res.error.message); return; }
  toast('✅ Pago com crédito de ' + nome);
  await carregarJobsPendentes();
  if (currentTab === 'cpr') renderCPR(); else renderDash();
}

let dreYear = new Date().getFullYear();

function renderDRE() {
  const el = document.getElementById('sv-dre');
  const cats = finConfig.cats || {};
  let items = lancamentos.filter(l => !l.transferencia && (l.data||'').startsWith(dreYear + ''));
  if (dreEtiqueta) items = items.filter(l => (l.etiquetas || []).includes(dreEtiqueta));

  const etqs = etiquetasEmUso();
  const etqBar = '<div class="etq-filter"><span class="lbl"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>Etiqueta:</span>'
    + '<span class="etq-fchip' + (!dreEtiqueta ? ' on' : '') + '" onclick="setDreEtiqueta(\'\')">Todas</span>'
    + etqs.map(t => '<span class="etq-fchip' + (dreEtiqueta === t ? ' on' : '') + '" onclick="setDreEtiqueta(\'' + impEsc(t).replace(/'/g, "\\'") + '\')">' + impEsc(t) + '</span>').join('')
    + '</div>';

  // Agrupa receitas por empresa → categoria
  // Agrupa despesas por empresa → categoria
  let html =
    '<div class="year-nav">' +
      '<button class="btn btn-ghost btn-sm" onclick="dreYear--;renderDRE()">◀</button>' +
      '<span class="year-label">' + dreYear + '</span>' +
      '<button class="btn btn-ghost btn-sm" onclick="dreYear++;renderDRE()">▶</button>' +
      '<span class="year-sublabel">DRE — Demonstrativo de Resultados' + (dreEtiqueta ? ' · etiqueta «' + impEsc(dreEtiqueta) + '»' : '') + '</span>' +
    '</div>' +
    etqBar +
    '<div style="overflow-x:auto"><table class="dre-table">';

  let totalReceitaGlobal = 0, totalDespesaGlobal = 0;

  for (const [emp, grps] of Object.entries(cats)) {
    const empItems = items.filter(l => l.conta === emp);
    if (!empItems.length) continue;

    html += '<tr class="dre-section-hdr"><td colspan="2">' + emp + '</td></tr>';

    // Receitas
    const recItems = empItems.filter(l => l.tipo === 'receita');
    if (recItems.length) {
      html += '<tr><td class="dre-rec-hdr">Receitas</td><td></td></tr>';
      const byCat = groupByCat(recItems);
      let totalRec = 0;
      for (const [cat, val] of Object.entries(byCat)) {
        html += '<tr><td class="dre-cat">' + cat + '</td><td class="fms-td-r col-success">' + fmtMoeda(val) + '</td></tr>';
        totalRec += val;
      }
      html += '<tr><td class="dre-total-label">Total Receitas</td><td class="fms-td-r col-success" style="font-weight:700">' + fmtMoeda(totalRec) + '</td></tr>';
      totalReceitaGlobal += totalRec;
    }

    // Despesas
    const despItems = empItems.filter(l => l.tipo === 'despesa');
    if (despItems.length) {
      html += '<tr><td class="dre-desp-hdr">Despesas</td><td></td></tr>';
      const byCat = groupByCat(despItems);
      let totalDesp = 0;
      for (const [cat, val] of Object.entries(byCat)) {
        html += '<tr><td class="dre-cat">' + cat + '</td><td class="fms-td-r col-danger">' + fmtMoeda(val) + '</td></tr>';
        totalDesp += val;
      }
      html += '<tr><td class="dre-total-label">Total Despesas</td><td class="fms-td-r col-danger" style="font-weight:700">' + fmtMoeda(totalDesp) + '</td></tr>';
      totalDespesaGlobal += totalDesp;

      // Resultado por empresa
      const recEmp = recItems.reduce((a,l) => a+Number(l.valor||0), 0);
      const res = recEmp - totalDesp;
      html += '<tr class="dre-total"><td>Resultado ' + emp.replace('Pandora ','') + '</td><td class="fms-td-r ' + (res>=0?'col-success':'col-danger') + '">' + fmtMoeda(res) + '</td></tr>';
    }
  }

  // Resultado global
  const resultadoGlobal = totalReceitaGlobal - totalDespesaGlobal;
  html +=
    '<tr style="height:8px"><td colspan="2"></td></tr>' +
    '<tr class="dre-total">' +
      '<td>RESULTADO LÍQUIDO ' + dreYear + '</td>' +
      '<td class="fms-td-r ' + (resultadoGlobal>=0?'col-success':'col-danger') + '">' + fmtMoeda(resultadoGlobal) + '</td>' +
    '</tr>';

  html += '</table></div>';

  if (!items.length) {
    html += '<div class="empty-state" style="padding:24px"><div class="es-icon"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></div></div><p>Nenhum lançamento em ' + dreYear + '.</p></div>';
  }

  el.innerHTML = html;
}

function groupByCat(items) {
  const result = {};
  for (const l of items) {
    const key = l.cat || '(sem categoria)';
    result[key] = (result[key] || 0) + Number(l.valor || 0);
  }
  return result;
}

    for (const meta of metas) {

        .filter(l => l.tipo === 'receita' && (!meta.conta || l.conta === meta.conta))
        .reduce((a,l) => a+Number(l.valor||0), 0);

      html +=
        '<div class="meta-card">' +
          '<div class="meta-hdr">' +
            '<div>' +
              '<div class="meta-nome">' + meta.nome + '</div>' +
              (meta.conta ? '<div class="meta-conta">' + meta.conta + '</div>' : '') +
            '</div>' +
            '<div style="display:flex;align-items:center;gap:8px">' +
              '<span class="meta-pct ' + corClass(pct) + '">' + pct + '%</span>' +

            '</div>' +

            '<span class="col-muted">Meta: <strong>' + fmtMoeda(meta.valor) + '</strong></span>' +
          '</div>' +
          '<div class="gauge-wrap"><div class="gauge-fill" style="width:' + pct + '%;background:' + corVal(pct) + '"></div></div>' +
        '</div>';
    }
  }

  el.innerHTML = html;
}

function openMetaModal() {
  const nome  = prompt('Nome da meta (ex: Receita Pandora Homes):');
  if (!nome || !nome.trim()) return;
  const valor = parseFloat(prompt('Valor alvo mensal (R$):'));
  if (!valor || valor <= 0) return;
  const contas = Object.keys(finConfig.cats || {});
  const contaOpt = prompt('Filtrar por empresa? (opcional)\n' + contas.join(', ') + '\nDeixe em branco para todas:');
  metas.push({ id: Date.now().toString(36), nome: nome.trim(), valor, conta: contas.includes(contaOpt) ? contaOpt : null });
  salvarMetas();
  renderMetas();
}

function excluirMeta(id) {
  if (!confirm('Excluir esta meta?')) return;
  metas = metas.filter(m => m.id !== id);
  salvarMetas();
  renderMetas();
}

      '</div>' +
      '<div class="form-row cols-2">' +
        '<div class="form-group"><label>% Parceiro</label><input type="number" id="simParceiro" value="50" step="1" oninput="calcSim()"></div>' +
        '<div class="form-group"><label>Dívida / Desconto (R$)</label><input type="text" id="simDesconto" placeholder="0,00" oninput="fmtCurInput(this);calcSim()" inputmode="decimal"></div>' +
      '</div>' +
      '<div class="sim-grid" id="simResultados"></div>' +
    '</div>';
  calcSim();
}

function calcSim() {
  const venda     = parseCur(document.getElementById('simVenda')?.value)    || 0;
  const pComissao = parseFloat(document.getElementById('simComissao')?.value) || 6;
  const pParceiro = parseFloat(document.getElementById('simParceiro')?.value) || 50;
  const desconto  = parseCur(document.getElementById('simDesconto')?.value) || 0;

  const comissaoTotal = venda * (pComissao / 100);
  const parteParceiro = comissaoTotal * (pParceiro / 100);
  const parteSua      = comissaoTotal - parteParceiro;
  const liquido       = parteSua - desconto;
  const impostos      = parteSua * 0.06; // estimativa 6% simples nacional
  const liquidoIR     = liquido - impostos;

  const el = document.getElementById('simResultados');
  if (!el) return;

  if (!venda) {
    el.innerHTML = '<div class="sim-empty">Preencha o valor de venda para calcular.</div>';
    return;
  }

  el.innerHTML =
    '<div class="sim-result"><div class="sim-result-label">Comissão total</div><div class="sim-result-val">' + fmtMoeda(comissaoTotal) + '</div></div>' +
    '<div class="sim-result"><div class="sim-result-label">Parte do parceiro (' + pParceiro + '%)</div><div class="sim-result-val col-muted">' + fmtMoeda(parteParceiro) + '</div></div>' +
    '<div class="sim-result"><div class="sim-result-label">Sua parte bruta</div><div class="sim-result-val col-accent">' + fmtMoeda(parteSua) + '</div></div>' +
    '<div class="sim-result"><div class="sim-result-label">Impostos estimados (6%)</div><div class="sim-result-val col-danger">−' + fmtMoeda(impostos) + '</div></div>' +
    '<div class="sim-result"><div class="sim-result-label">Desconto/Dívida</div><div class="sim-result-val col-danger">−' + fmtMoeda(desconto) + '</div></div>' +
    '<div class="sim-result sim-result-highlight"><div class="sim-result-label">Líquido estimado</div><div class="sim-result-val col-success">' + fmtMoeda(liquidoIR) + '</div></div>';
}

// ── A Receber: janela de confirmação ──────────────────────────────────────────
let _fmsRecebJob = null;

function inferirCatFMS(servicos) {
  const s = new Set(servicos||[]);
  if (s.has('F')&&s.has('Y')&&s.has('R')) return 'Pacote completo F+Y+R';
  if (s.has('F')&&s.has('R')) return 'Foto + Reels';
  if (s.has('Y')) return 'YouTube';
  return 'Foto';
}

// Recebe o ID do job (funciona igual no Dashboard e na aba "A Receber" — busca fresco no banco)
async function abrirFMSRecebimento(jobId) {
  const { data: j } = await db().from('jobs').select('*').eq('id', jobId).single();
  if (!j) { toast('❌ Job não encontrado'); return; }
  if (j.status === 'pago') { toast('⚠️ Este job já foi recebido'); await carregarJobsPendentes(); return; }
  _fmsRecebJob = j;
  const nome = j.tipo === 'RE/MAX Studio 76' ? (j.corretor||'RE/MAX Studio 76') : (j.cliente_nome||j.tipo||'');
  document.getElementById('fmsRecebData').value  = todayStr();
  setCur('fmsRecebValor', j.preco);
  document.getElementById('fmsRecebCat').value   = inferirCatFMS(j.servicos);
  document.getElementById('fmsRecebSub').value   = nome;
  document.getElementById('fmsRecebConta').value = 'Pandora Foto Vídeo';
  // Banco (4.15): lista os bancos cadastrados, já marcado em Nubank PJ (padrão); trocar quando cair em outra conta
  const banks = (finConfig.banks && finConfig.banks.length) ? finConfig.banks : ['Nubank PJ'];
  const selBanco = document.getElementById('fmsRecebBanco');
  selBanco.innerHTML = banks.map(b => '<option' + (b === 'Nubank PJ' ? ' selected' : '') + '>' + b + '</option>').join('');
  document.getElementById('fmsRecebOverlay').classList.add('open');
}

async function confirmarFMSRecebimento() {
  const j = _fmsRecebJob; if (!j) return;
  const fresh = await db().from('jobs').select('status').eq('id', j.id).single();
  if (fresh.data && fresh.data.status === 'pago') {   // guard: já recebido em outro lugar
    toast('⚠️ Este job já foi recebido');
    fecharFMSRecebimento();
    await carregarJobsPendentes();
    if (currentTab === 'cpr') renderCPR(); else renderDash();
    return;
  }
  const data  = document.getElementById('fmsRecebData').value;
  if (!data) { toast('⚠️ Data obrigatória'); return; }
  const valor = parseCur(document.getElementById('fmsRecebValor').value)||j.preco;
  const cat   = document.getElementById('fmsRecebCat').value;
  const sub   = document.getElementById('fmsRecebSub').value.trim()||null;
  const conta = document.getElementById('fmsRecebConta').value;
  const banco = document.getElementById('fmsRecebBanco').value;
  if (!banco) { toast('⚠️ Escolha o banco'); return; }
  const nome  = sub||(j.cliente_nome||j.tipo||'');
  const { error: errL } = await db().from('lancamentos').insert({
    data, descricao: 'Job Photo: '+nome+(j.rua?' — '+j.rua:''),
    valor, tipo:'receita', cat, sub, conta, banco,
    obs:'Registrado via FMS — A Receber', job_id: j.id,
    updated_at: new Date().toISOString()
  });
  if (errL) { toast('❌ Erro ao criar lançamento: '+errL.message); return; }
  const { error: errJ } = await db().from('jobs').update({ status:'pago', pago:true, updated_at:new Date().toISOString() }).eq('id', j.id);
  if (errJ) { toast('⚠️ Lançamento criado, mas erro ao atualizar job: '+errJ.message); }
  toast('✅ Recebimento registrado');
  fecharFMSRecebimento();
  await Promise.all([carregarLancamentos(), carregarJobsPendentes()]);
  if (currentTab === 'cpr') renderCPR(); else renderDash();
}

function fecharFMSRecebimento() {
  document.getElementById('fmsRecebOverlay').classList.remove('open');
  _fmsRecebJob = null;
}

// ── Confirmar recebimento de lançamento pendente ──────────────────────────────
async function confirmarLancRecebimento(id) {
  const l = lancamentos.find(x => x.id === id); if (!l) return;
  const desc = l.descricao || 'este lançamento';
  if (!confirm('Confirmar recebimento de ' + fmtMoeda(l.valor) + '?\n' + desc)) return;
  const { error } = await db().from('lancamentos').update({ pago: true, updated_at: new Date().toISOString() }).eq('id', id);
  if (error) { toast('❌ Erro: ' + error.message); return; }
  toast('✅ Recebimento confirmado — ' + fmtMoeda(l.valor));
  await carregarLancamentos();
  renderDash();
}

// ── Item 8: Persistir contexto ────────────────────────────────────────────────
function saveFmsCtx(p) {
  localStorage.setItem('fms_ctx', JSON.stringify({
    conta: p.conta, grp: p.tipo === 'receita' ? 'Receita' : 'Despesa', cat: p.cat, sub: p.sub, banco: p.banco
  }));
}
function loadFmsCtx() {
  try { return JSON.parse(localStorage.getItem('fms_ctx') || '{}'); } catch { return {}; }
}

// ── Item 7: Autocomplete na descrição ────────────────────────────────────────
function setupDescAC() {
  const input = document.getElementById('fDesc'); if (!input) return;
  if (input.parentNode?.classList.contains('desc-ac-wrap')) return; // já configurado
  const wrap = document.createElement('div'); wrap.className = 'desc-ac-wrap';
  input.parentNode.insertBefore(wrap, input); wrap.appendChild(input);
  const drop = document.createElement('div'); drop.className = 'desc-ac-drop'; wrap.appendChild(drop);
  let _t;
  input.addEventListener('input', () => {
    clearTimeout(_t);
    const q = input.value.trim().toLowerCase();
    if (q.length < 2) { drop.style.display = 'none'; return; }
    _t = setTimeout(() => {
      const seen = new Set();
      const matches = lancamentos
        .map(l => l.descricao || '')
        .filter(d => { const k = d.toLowerCase(); return k.includes(q) && !seen.has(k) && seen.add(k); })
        .slice(0, 8);
      if (!matches.length) { drop.style.display = 'none'; return; }
      drop.innerHTML = matches.map(d => '<div class="desc-ac-item">' + d + '</div>').join('');
      drop.querySelectorAll('.desc-ac-item').forEach(el => el.addEventListener('mousedown', e => {
        e.preventDefault(); input.value = el.textContent; drop.style.display = 'none';
      }));
      drop.style.display = 'block';
    }, 200);
  });
  input.addEventListener('blur', () => setTimeout(() => drop.style.display = 'none', 200));
}
