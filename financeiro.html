<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financeiro — Alex OS</title>
  <link rel="stylesheet" href="css/base.css?v=20260713h">
  <style>
    /* ── Subtabs ── */
    /* .subtab herda o padrão central em pílula (base.css) — sem override local aqui (10.4) */
    .subview { display: none; }
    .subview.active { display: block; }

    /* ── Config isolado + Ferramentas (agrupa Metas/Reservas/Simulador, 10.4) ── */
    .fmsd-gear { width: 32px; height: 32px; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--surface); color: var(--muted); display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .fmsd-gear:hover { color: var(--text); }
    .fmsd-gear svg { width: 16px; height: 16px; }
    .fmsd-gear.active { color: var(--accent); background: var(--accent-sel); box-shadow: inset 0 0 0 1px var(--accent-line); }
    .fmsd-tools { position: relative; }
    .fmsd-tools-btn { display: flex; align-items: center; gap: 7px; }
    .fmsd-tools-btn svg.chev { width: 11px; height: 11px; transition: transform .15s; }
    .fmsd-tools-btn.open svg.chev { transform: rotate(180deg); }
    .fmsd-tools-menu { position: absolute; top: calc(100% + 6px); left: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: 0 8px 20px rgba(0,0,0,.35); padding: 6px; min-width: 170px; z-index: 30; display: none; }
    .fmsd-tools-menu.open { display: block; }
    .fmsd-tools-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; font-size: 12.5px; color: var(--text); cursor: pointer; white-space: nowrap; }
    .fmsd-tools-item svg { width: 15px; height: 15px; stroke: var(--muted); }
    .fmsd-tools-item:hover { background: var(--surface2); }
    .fmsd-tools-item.active { color: var(--accent); }
    .fmsd-tools-item.active svg { stroke: var(--accent); }

    /* ── KPIs (mesmo padrão do Jobs/P&V) ──
       .kpi/.kpi-val/.kpi-label/.kpi-sub são classes globais (base.css) reaproveitadas
       por outras páginas (Dia usa .kpi como flex-row!). Só ajustamos o CONTAINER
       (.kpi precisa virar block, senão herda o display:flex do Dia; min-width:0 evita
       o texto empurrar a coluna do grid pra fora) — a tipografia de .kpi-val/.kpi-label/
       .kpi-sub é protegida centralmente (29px Montserrat) e não deve ser sobrescrita. */
    .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-bottom: 20px; }
    @media (max-width: 700px) { .kpi-row { grid-template-columns: 1fr; } }
    .kpi-row .kpi { display: block; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px; min-width: 0; }
    .kpi-row .kpi-val { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px; min-width: 0; }
    .kpi-row .kpi-val > span:first-child { white-space: nowrap; }
    .kpi-label { margin-bottom: 10px; }
    .kpi-sub { margin-top: 8px; }

    /* ── Navegação mês ── */
    .month-nav { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .month-nav button { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 14px; }
    .month-nav button:hover { background: var(--border); }
    .month-label { font-size: 16px; font-weight: 700; min-width: 160px; text-align: center; }

    /* ── Tabela lançamentos ── */
    .lanc-table-wrap { overflow-x: auto; }
    .lanc-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .lanc-table th { text-align: left; padding: 7px 10px; color: var(--muted); font-size: 11px; text-transform: uppercase; border-bottom: 1px solid var(--border); white-space: nowrap; }
    .lanc-table td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .lanc-table tr:hover td { background: var(--surface2); cursor: pointer; }
    .lanc-table tr:last-child td { border-bottom: none; }
    .val-rec  { color: var(--success); font-weight: 600; }
    .val-desp { color: var(--danger);  font-weight: 600; }
    .tag-sub  { font-size: 11px; color: var(--muted); }
    .tipo-badge { display:inline-block;font-size:9px;font-weight:800;padding:1px 6px;border-radius:20px;margin-right:6px;vertical-align:middle;letter-spacing:.3px; }
    .tipo-badge.rec  { background:rgba(34,197,94,.15);color:var(--success);border:1px solid rgba(34,197,94,.3); }
    .tipo-badge.desp { background:rgba(239,68,68,.12);color:var(--danger);border:1px solid rgba(239,68,68,.25); }
    .desc-ac-wrap { position:relative; }
    .desc-ac-drop { position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:7px;z-index:50;max-height:180px;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.3);display:none; }
    .desc-ac-item { padding:7px 10px;font-size:13px;cursor:pointer; }
    .desc-ac-item:hover { background:var(--surface2); }

    /* ── Config ── */
    .config-section { margin-bottom: 28px; }
    .config-section-title { font-size: 14px; font-weight: 700; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .cats-tree { display: flex; flex-direction: column; gap: 8px; }
    .cats-empresa { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .cats-empresa-hdr { padding: 10px 14px; font-weight: 700; font-size: 13px; background: var(--surface2); border-bottom: 1px solid var(--border); }
    .cats-grp { padding: 10px 14px; }
    .cats-grp-label { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-bottom: 8px; }
    .cats-cat-row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .cats-cat-name { font-size: 13px; font-weight: 600; min-width: 150px; }
    .cats-subs { display: flex; gap: 5px; flex-wrap: wrap; flex: 1; }
    .cats-sub-tag { font-size: 11px; padding: 2px 8px; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; color: var(--muted); }
    .cats-cat-edit { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 12px; padding: 2px 6px; border-radius: 4px; flex-shrink: 0; }
    .cats-cat-edit:hover { background: var(--surface2); color: var(--text); }

    .banks-list { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .bank-tag { display: flex; align-items: center; gap: 6px; background: var(--surface2); border: 1px solid var(--border); border-radius: 7px; padding: 5px 10px; font-size: 13px; }
    .bank-tag button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; padding: 0; }
    .bank-tag button:hover { color: var(--danger); }

    .modal-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .modal-close { background: none; border: none; color: var(--muted); font-size: 22px; cursor: pointer; padding: 0 4px; line-height: 1; }
    .modal-close:hover { color: var(--text); }
    .form-group { margin-bottom: 12px; }
    .form-group label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }

    /* ── Dashboard ── */
    .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
    .dash-grid > .card { min-width: 0; }
    @media (max-width: 700px) { .dash-grid { grid-template-columns: 1fr; } }
    .dash-recent-wrap { overflow-x: auto; }
    .dash-recent-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .dash-recent-table td { padding: 7px 6px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .dash-recent-table tr:last-child td { border-bottom: none; }
    @media (max-width: 480px) { .recentes-desc { max-width: 120px; } }
    .arrow-up   { color: var(--success); font-size: 10px; margin-left: 4px; }
    .arrow-down { color: var(--danger);  font-size: 10px; margin-left: 4px; }

    /* ── Quick Entry ── */
    .qe-form { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .qe-row   { display: grid; gap: 8px; min-width: 0; }
    .qe-row > div { min-width: 0; } /* essencial no Safari: o input type=date tem largura mínima nativa maior e sem isso estoura a coluna do grid */
    .qe-2 { grid-template-columns: 1fr 1fr; }
    .qe-3 { grid-template-columns: 1fr 1fr 1fr; }
    .qe-vd { grid-template-columns: 1fr 1fr; } /* Valor+Data — sempre lado a lado, inclusive no celular */
    @media (max-width: 480px) { .qe-2, .qe-3 { grid-template-columns: 1fr; } }
    .qe-form input, .qe-form select { min-width: 0; }
    .qe-pago-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text); padding: 6px 0 2px; }
    .qe-pago-row input { width: 16px; height: 16px; accent-color: var(--accent); }
    .qe-pago-hint { font-size: 11px; color: var(--muted); }

    /* ── Gráficos (Dashboard, 10.4) ── */
    .fmsd-graf-toggle { display: inline-flex; background: var(--surface2); border-radius: 999px; padding: 3px; border: 1px solid var(--border); }
    .fmsd-graf-toggle span { padding: 6px 16px; border-radius: 999px; font-size: 12.5px; font-weight: 600; cursor: pointer; color: var(--muted); }
    .fmsd-graf-toggle span.on { background: var(--accent); color: #fff; }
    .fmsd-graf-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; margin-bottom: 14px; }
    @media (max-width: 700px) { .fmsd-graf-grid { grid-template-columns: 1fr; } }
    .fmsd-bar-chart { display: flex; align-items: flex-end; gap: 8px; height: 130px; margin-top: 6px; }
    .fmsd-bar-chart.ano { gap: 34px; }
    .fmsd-bar-pair { flex: 1; display: flex; align-items: flex-end; gap: 2px; height: 100%; }
    .fmsd-bar { flex: 1; border-radius: 3px 3px 0 0; min-height: 1px; }
    .fmsd-bar.rec { background: var(--success); }
    .fmsd-bar.desp { background: var(--danger); }
    .fmsd-bar-labels { display: flex; gap: 8px; margin-top: 6px; }
    .fmsd-bar-labels.ano { gap: 34px; }
    .fmsd-bar-labels span { flex: 1; text-align: center; font-size: 10.5px; color: var(--muted); }
    .fmsd-legend { display: flex; gap: 14px; margin-top: 12px; font-size: 11px; color: var(--muted); }
    .fmsd-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
    .fmsd-pie-list { display: flex; flex-direction: column; gap: 10px; }
    .fmsd-pie-row { display: flex; align-items: center; gap: 9px; font-size: 12.5px; }
    .fmsd-pie-dot { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
    .fmsd-pie-name { flex: 1; color: var(--text); }
    .fmsd-pie-val { color: var(--muted); font-weight: 600; }
    .fmsd-ytd-kpi { display: none; background: var(--accent-pale); border: 1px solid rgba(255,102,0,.3); border-radius: 10px; padding: 11px 15px; margin-bottom: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    .fmsd-ytd-kpi.on { display: flex; }
    .fmsd-ytd-kpi .k { font-size: 12.5px; color: var(--text); }
    .fmsd-ytd-kpi .v { font-family: var(--font-brand); font-weight: 800; font-size: 18px; color: var(--accent); }

    /* ── Fluxo ── */
    .fluxo-table-wrap { overflow-x: auto; }
    .fluxo-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 480px; }
    .fluxo-table th { text-align: right; padding: 6px 8px; color: var(--muted); font-size: 11px; text-transform: uppercase; border-bottom: 1px solid var(--border); white-space: nowrap; }
    .fluxo-table th:first-child { text-align: left; }
    .fluxo-table td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    .fluxo-table td:first-child { text-align: left; font-weight: 500; }
    .fluxo-table tfoot td { font-weight: 700; border-top: 2px solid var(--border); border-bottom: none; }

    /* ── A Receber ── */
    .cpr-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
    .cpr-row:last-child { border-bottom: none; }

    /* ── DRE ── */
    .dre-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .dre-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
    .dre-table tr:last-child td { border-bottom: none; }
    .dre-section-hdr td { font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); background: var(--surface2); padding: 6px 10px; }
    .dre-total td { font-weight: 700; border-top: 2px solid var(--border) !important; }
    .dre-cat { color: var(--muted); padding-left: 20px !important; font-size: 12px; }

    /* ── Metas / Reservas ── */
    .meta-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 12px; }
    .meta-hdr  { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .meta-nome { font-weight: 700; font-size: 14px; }
    .gauge-wrap { background: var(--surface2); border-radius: 20px; height: 8px; overflow: hidden; margin: 6px 0 4px; }
    .gauge-fill { height: 100%; border-radius: 20px; transition: width .3s; }

    /* ── Simulador ── */
    .sim-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 16px; }
    .sim-result { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; text-align: center; }
    .sim-result-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
    .sim-result-val   { font-size: 18px; font-weight: 700; }

    /* ── Filtro tipo ── */
    .tipo-filter { display: flex; gap: 6px; margin-bottom: 12px; }
    .tipo-filter button { padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface2); color: var(--muted); font-size: 12px; cursor: pointer; transition: .15s; }
    .tipo-filter button.f-all  { border-color: var(--accent);  background: var(--accent-pale);  color: var(--accent); }
    .tipo-filter button.f-rec  { border-color: var(--success); background: rgba(34,197,94,.1);   color: var(--success); }
    .tipo-filter button.f-desp { border-color: var(--danger);  background: rgba(239,68,68,.1);   color: var(--danger); }

    /* ── Design System D — Financeiro ── */
    /* Estrutura de card/seção */
    .card-title    { font-size:14px;font-weight:700;margin-bottom:12px }
    .card-title-lg { font-size:16px;font-weight:700;margin-bottom:16px }
    .card-sublabel { font-size:13px;color:var(--muted);margin-bottom:4px }
    .card-hdr      { display:flex;justify-content:space-between;align-items:center;margin-bottom:10px }
    .sec-hdr       { display:flex;align-items:center;justify-content:space-between;margin-bottom:12px }
    .sec-title     { font-size:14px;font-weight:700 }
    .sec-label     { font-size:13px;color:var(--muted) }
    .sec-block     { margin-top:28px }
    .kpi-clickable { cursor:pointer }
    /* Navegação de ano */
    .year-nav      { display:flex;align-items:center;gap:10px;margin-bottom:16px }
    .year-label    { font-size:16px }
    .year-sublabel { font-size:12px;color:var(--muted) }
    /* Tabelas FMS (A Receber em Dash e CPR) */
    .fms-table-wrap   { overflow-x:auto }
    .fms-table        { width:100%;border-collapse:collapse;font-size:13px }
    .fms-thead-row    { background:var(--surface2) }
    .fms-th           { padding:7px 10px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted) }
    .fms-th-r         { padding:7px 10px;text-align:right;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted) }
    .fms-td-date      { font-size:12px;color:var(--muted);white-space:nowrap }
    .fms-td-nome      { font-weight:600 }
    .fms-td-sub       { font-size:12px;color:var(--muted) }
    .fms-td-val       { font-weight:600;color:var(--success);text-align:right;white-space:nowrap }
    .fms-td-r         { text-align:right }
    .fms-empty        { color:var(--muted);font-size:13px;padding:16px 0 }
    .fms-notice       { margin-top:16px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:8px;font-size:12px;color:var(--muted) }
    .atraso-badge     { font-size:10px;color:var(--danger);margin-left:6px }
    .secreceber       { margin-top:24px }
    .seccom           { margin-top:16px }
    /* CPR standalone */
    .cpr-info         { flex:1;min-width:0 }
    .cpr-nome         { font-weight:600;font-size:13px }
    .cpr-sub          { font-size:12px;color:var(--muted) }
    .cpr-status       { font-size:11px;padding:2px 8px;border-radius:10px }
    .cpr-val          { font-weight:700;font-size:14px;min-width:80px;text-align:right }
    .cpr-empty        { padding:12px 0;color:var(--muted);font-size:13px }
    .cpr-count        { font-size:12px;color:var(--muted) }
    /* DRE */
    .dre-rec-hdr      { font-weight:600;color:var(--success) }
    .dre-desp-hdr     { font-weight:600;color:var(--danger) }
    .dre-total-label  { padding-left:10px;font-weight:600 }
    /* Metas */
    .meta-conta       { font-size:11px;color:var(--muted) }
    .meta-pct         { font-size:13px;font-weight:700 }
    .meta-row         { display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px }
    /* Reservas */
    .reservas-grid    { display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start }
    .saldo-val        { font-size:24px;font-weight:700;margin-bottom:8px }
    .gauge-hint       { font-size:11px;color:var(--muted);margin-top:4px }
    .reservas-detail  { margin-top:12px;padding-top:12px;border-top:1px solid var(--border) }
    .reserva-row      { display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px }
    .reserva-val      { font-weight:700;color:var(--warn) }
    .reserva-total-row     { display:flex;justify-content:space-between;font-size:14px;font-weight:700;padding-top:8px;border-top:1px solid var(--border) }
    .reserva-disponivel-row{ display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-top:8px }
    /* Simulador */
    .sim-empty            { color:var(--muted);font-size:13px;padding:12px 0 }
    .sim-result-highlight { border:1px solid var(--accent) }
    /* Recentes (Dash) */
    .recentes-desc  { white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px }
    .recentes-sub   { font-size:11px;color:var(--muted) }
    .recentes-val   { text-align:right;font-weight:600;white-space:nowrap }
    /* Config */
    .config-empty-sub { font-size:11px;color:var(--muted) }
    .config-banco-empty { color:var(--muted);font-size:13px }
    /* ── Etiquetas (Fatia 4.9) ── */
    .etq-box        { display:flex;flex-wrap:wrap;gap:6px;margin-bottom:7px;min-height:4px }
    .etq-chip       { display:inline-flex;align-items:center;gap:6px;background:var(--info-pale);color:var(--info);border:1px solid rgba(59,130,246,.3);border-radius:20px;padding:3px 10px;font-size:12px;font-weight:600 }
    .etq-chip .x    { cursor:pointer;opacity:.7;font-weight:700 }
    .etq-chip .x:hover { opacity:1 }
    .etq-seg        { display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden }
    .etq-seg span   { padding:7px 15px;font-size:12.5px;color:var(--muted);cursor:pointer;border-right:1px solid var(--border) }
    .etq-seg span:last-child { border-right:none }
    .etq-seg span.on { background:var(--accent-pale);color:var(--accent);font-weight:700 }
    .etq-filter     { display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:12px }
    .etq-filter .lbl{ font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-right:2px }
    .etq-fchip      { font-size:12px;color:var(--muted);background:var(--surface2);border:1px solid var(--border);border-radius:18px;padding:4px 11px;cursor:pointer }
    .etq-fchip.on   { background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700 }
    .etq-total      { display:flex;justify-content:space-between;align-items:center;background:var(--accent-pale);border:1px solid rgba(255,102,0,.3);border-radius:10px;padding:11px 15px;margin-bottom:12px }
    .etq-total .k   { font-size:13px;color:var(--text) }
    .etq-total .v   { font-family:var(--font-brand);font-weight:800;font-size:18px;color:var(--accent) }
    .etq-row-tags   { display:inline-flex;gap:5px;margin-left:26px }
    .etq-row-tags .t{ font-size:10px;font-weight:700;background:var(--info-pale);color:var(--info);border-radius:12px;padding:1px 7px }
    /* ── Importador (Fatia 4.10) ── */
    .imp-drop        { border:2px dashed #3a3a3a;border-radius:14px;background:var(--surface);padding:36px 24px;text-align:center;transition:border-color .15s,background .15s }
    .imp-drop.over   { border-color:var(--accent);background:var(--accent-pale) }
    .imp-drop-ico    { font-size:34px;margin-bottom:8px }
    .imp-drop h3     { font-family:var(--font-brand);font-weight:500;font-size:17px;margin:0 0 4px }
    .imp-drop p      { color:var(--muted);font-size:13px;margin:0 0 14px }
    .imp-srcrow      { display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:18px }
    .imp-srcchip     { display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:12px;color:var(--muted) }
    .imp-srcchip b   { color:var(--text);font-weight:600 }
    .imp-note        { font-size:12.5px;color:var(--muted);margin-top:12px;padding-left:12px;border-left:2px solid var(--accent) }
    .imp-sumbar      { display:flex;gap:12px;flex-wrap:wrap;margin:4px 0 16px }
    .imp-stat        { background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;min-width:112px }
    .imp-stat .k     { font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted) }
    .imp-stat .v     { font-family:var(--font-brand);font-weight:800;font-size:21px;margin-top:3px }
    .imp-stat.ok .v  { color:var(--success) }
    .imp-stat.dup .v { color:var(--warn) }
    .imp-stat.tr .v  { color:var(--info) }
    .imp-stat.inv .v { color:#8b5cf6 }
    .imp-tbar        { display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:12px }
    .imp-tbar select,.imp-tbar input { background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:7px 10px;font-family:var(--font-ui);font-size:13px }
    .imp-seg         { display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden }
    .imp-seg span    { padding:7px 12px;font-size:12px;color:var(--muted);cursor:pointer;border-right:1px solid var(--border) }
    .imp-seg span:last-child { border-right:none }
    .imp-seg span.on { background:var(--accent-pale);color:var(--accent);font-weight:700 }
    .imp-grow        { margin-left:auto }
    .imp-tablewrap   { background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden }
    .imp-table       { width:100%;border-collapse:collapse;font-size:12.5px }
    .imp-table thead th { font-family:var(--font-brand);font-weight:700;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 9px;border-bottom:1px solid var(--border);white-space:nowrap }
    .imp-table tbody td { padding:8px 9px;border-bottom:1px solid #232323;vertical-align:middle }
    .imp-table tbody tr:hover { background:#1d1d1d }
    .imp-table tr.off { opacity:.45 }
    .imp-table tr.off .imp-desc { text-decoration:line-through }
    .imp-chk         { width:15px;height:15px;accent-color:var(--accent);cursor:pointer }
    .imp-desc        { font-weight:500 }
    .imp-sub         { color:var(--muted);font-size:11px }
    .imp-val         { font-family:var(--font-brand);font-weight:700;text-align:right;white-space:nowrap }
    .imp-val.neg     { color:var(--danger) }
    .imp-val.pos     { color:var(--success) }
    .imp-mini        { background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--text);padding:5px 6px;font-size:11.5px;font-family:var(--font-ui);max-width:150px }
    .imp-mini.emp    { border-color:rgba(255,102,0,.4) }
    .imp-tag         { display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap }
    .imp-tag.new     { background:var(--success-pale);color:var(--success) }
    .imp-tag.dup     { background:var(--warn-pale);color:var(--warn) }
    .imp-tag.tr      { background:var(--info-pale);color:var(--info) }
    .imp-tag.inv     { background:rgba(139,92,246,.12);color:#8b5cf6 }
    .imp-foot        { display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid var(--border);background:var(--surface2);flex-wrap:wrap }
    .imp-foot .muted { color:var(--muted);font-size:12.5px }
    .imp-legend      { display:flex;gap:14px;flex-wrap:wrap;margin-top:13px;font-size:11.5px;color:var(--muted) }
    .imp-empty       { color:var(--muted);font-size:13px;padding:30px;text-align:center }
    .imp-help        { background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-top:16px }
    .imp-help h4     { font-family:var(--font-brand);font-weight:600;font-size:14px;margin:0 0 10px }
    .imp-help ol     { margin:0;padding-left:20px }
    .imp-help li     { margin-bottom:5px;font-size:13px;color:var(--text) }
    .imp-help .imp-tags { display:flex;gap:8px;flex-wrap:wrap;margin-top:13px }
    .imp-help .imp-tagline { font-size:12px;color:var(--muted);width:100%;margin-top:3px }
    .imp-undo        { display:flex;align-items:center;gap:12px;background:var(--success-pale);border:1px solid rgba(34,197,94,.3);border-radius:10px;padding:11px 14px;margin-bottom:16px;font-size:13px }
    .imp-undo b      { color:var(--text) }
    .imp-undo .imp-grow { margin-left:auto }
    /* ── Saldos (Fatia 4.12) ── */
    .sd-total        { display:flex;align-items:baseline;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 22px;margin-bottom:20px;flex-wrap:wrap }
    .sd-total .lbl   { font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted) }
    .sd-total .v     { font-family:var(--font-brand);font-weight:800;font-size:30px;letter-spacing:-.02em }
    .sd-total .sub   { color:var(--muted);font-size:12px;margin-left:auto }
    .sd-cards        { display:grid;grid-template-columns:repeat(2,1fr);gap:16px }
    .sd-acct         { background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px }
    .sd-h            { display:flex;align-items:center;gap:10px;margin-bottom:12px }
    .sd-ico          { width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;background:var(--surface2) }
    .sd-ico.nu       { background:rgba(130,40,200,.18) }
    .sd-ico.bipa     { background:rgba(255,102,0,.16) }
    .sd-nome         { font-family:var(--font-brand);font-weight:600;font-size:15px }
    .sd-tag          { font-size:10.5px;color:var(--muted);font-weight:600 }
    .sd-saldo        { font-family:var(--font-brand);font-weight:800;font-size:25px;letter-spacing:-.02em;margin-bottom:4px }
    .sd-diff         { display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:20px }
    .sd-diff.ok      { background:var(--success-pale);color:var(--success) }
    .sd-diff.bad     { background:var(--warn-pale);color:var(--warn) }
    .sd-diff.none    { background:var(--surface2);color:var(--muted) }
    .sd-rows         { margin-top:13px;border-top:1px solid var(--border);padding-top:11px }
    .sd-row          { display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px }
    .sd-row .k       { color:var(--muted) }
    .sd-row .v       { font-weight:600 }
    .sd-foot         { margin-top:11px;display:flex;gap:14px }
    .sd-lnk          { font-size:11.5px;color:var(--accent);cursor:pointer;background:none;border:none;padding:0;font-family:var(--font-ui) }
    .sd-regina       { background:var(--surface);border:1px dashed var(--border);border-radius:12px;padding:15px 18px;margin-top:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap }
    .sd-regina .v    { font-family:var(--font-brand);font-weight:800;font-size:22px;color:var(--warn) }
    .sd-regina .txt  { font-size:12.5px;color:var(--muted);flex:1;min-width:200px }
    .sd-regina .txt b{ color:var(--text) }
    .sd-help         { font-size:12.5px;color:var(--muted);margin-top:16px;padding-left:12px;border-left:2px solid var(--accent) }
    @media(max-width:720px){ .sd-cards{grid-template-columns:1fr} }
  </style>
</head>
<body>

<!-- ── Modal Lançamento ── -->
<div class="modal-overlay" id="lancOverlay" onclick="closeLancModal()">
  <div class="modal" onclick="event.stopPropagation()" style="max-width:520px">
    <div class="modal-hdr">
      <div class="modal-title" id="lancModalTitulo">Novo Lançamento</div>
      <button class="modal-close" onclick="closeLancModal()">×</button>
    </div>
    <div class="form-row cols-2">
      <div class="form-group"><label>Valor (R$) *</label><input type="text" id="fValor" placeholder="0,00" oninput="fmtCurInput(this)" inputmode="decimal"></div>
      <div class="form-group"><label>Data *</label><input type="date" id="fData"></div>
    </div>
    <div class="form-row cols-3">
      <div class="form-group"><label>Empresa</label><select id="fConta" onchange="onContaChange()"></select></div>
      <div class="form-group"><label>Tipo</label><select id="fGrp" onchange="onGrpChange()"></select></div>
      <div class="form-group"><label>Categoria</label><select id="fCat" onchange="onCatChange()"></select></div>
    </div>
    <div class="form-row cols-2">
      <div class="form-group"><label>Subcategoria</label><select id="fSub"></select></div>
      <div class="form-group"><label>Banco</label><select id="fBanco"></select></div>
    </div>
    <div class="form-group"><label>Descrição *</label><input type="text" id="fDesc" placeholder="Ex: Comissão Ed. Cumaru, Adobe Lightroom..."></div>
    <div class="form-group"><label>Observação</label><input type="text" id="fObs" placeholder="Notas..."></div>
    <div class="form-group">
      <label><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>Etiquetas <span style="text-transform:none;font-weight:normal;color:var(--muted)">(opcional, pode ter várias)</span></label>
      <div class="etq-box" id="fTagsBox"></div>
      <input type="text" id="fTagInput" list="fTagList" placeholder="digite e Enter, ou escolha da lista…" onkeydown="lancTagKey(event)" onchange="if(etiquetaSugestoes().includes(this.value)){lancAddTag(this.value);this.value='';}" autocomplete="off">
      <datalist id="fTagList"></datalist>
    </div>
    <div class="form-group">
      <label>Gasto fixo ou variável?</label>
      <div class="etq-seg" id="fFixVar"></div>
    </div>
    <div class="form-group" id="fPagoRow" style="display:none">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:normal">
        <input type="checkbox" id="fPago" checked style="width:16px;height:16px;accent-color:var(--accent)">
        <span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><polyline points="20 6 9 17 4 12"/></svg>Já recebido</span>
        <span style="font-size:11px;color:var(--muted)">(desmarque para registrar como "a receber")</span>
      </label>
    </div>
    <div class="modal-actions">
      <div class="modal-actions-left">
        <button class="btn btn-danger btn-sm" id="btnLancDel" onclick="excluirLanc()" style="display:none"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Excluir</button>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="closeLancModal()">Cancelar</button>
      <button class="btn btn-primary btn-sm" onclick="salvarLanc()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>Salvar</button>
    </div>
  </div>
</div>

<!-- ── Modal Categoria ── -->
<div class="modal-overlay" id="catOverlay" onclick="closeCatModal()">
  <div class="modal" onclick="event.stopPropagation()" style="max-width:460px">
    <div class="modal-hdr">
      <div class="modal-title" id="catModalTitulo">Nova Categoria</div>
      <button class="modal-close" onclick="closeCatModal()">×</button>
    </div>
    <div class="form-row cols-2">
      <div class="form-group"><label>Empresa</label><select id="fCatEmp" onchange="onCatEmpChange()"></select></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script src="js/auth.js?v=20260706c"></script>

<script>
// ── Estado ────────────────────────────────────────────────────────────────────
let lancamentos    = [];
let jobsPendentes  = [];
const SVC_FMS = { F: 'Foto', Y: 'YouTube', R: 'Reels' };
let finConfig = { cats: {}, banks: [] };
let editLancId = null;
let editCatKey = null;
let currentTab = 'lanc';
let curYear  = new Date().getFullYear();
let curMonth = new Date().getMonth(); // 0-indexed
let filtroTipo = 'all';

// ── Etiquetas (Fatia 4.9) ──
const ETIQ_SEED = ['Iacanga', 'Manuela', 'Maria Victoria', 'Pandora-pet', 'Dívida mãe', 'Investimento'];
const ETIQ_FIXVAR = ['Fixo', 'Variável'];
let filtroEtiqueta = '';      // etiqueta selecionada no filtro (Lançamentos)
let dreEtiqueta    = '';      // etiqueta selecionada no DRE
let lancTags       = [];      // etiquetas em edição no modal (sem Fixo/Variável)
let lancFixVar     = '';      // 'Fixo' | 'Variável' | ''
let etiquetaExtras = [];      // sugestões de imóveis/jobs carregadas do banco
let qdTags         = [];      // etiquetas em edição no Lançamento rápido (Dashboard, 10.4)
let qdFixVar       = '';
let fmsGrafModo    = 'mes';   // 'mes' | 'ano' — Gráficos do Dashboard (10.4)

const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

// Lista de sugestões: sementes + já usadas nos lançamentos + imóveis/jobs
function etiquetaSugestoes() {
  const set = new Set(ETIQ_SEED);
  lancamentos.forEach(l => (l.etiquetas || []).forEach(t => { if (!ETIQ_FIXVAR.includes(t)) set.add(t); }));
  etiquetaExtras.forEach(t => set.add(t));
  return Array.from(set).sort((a, b) => a.localeCompare(b));
}
// Todas as etiquetas em uso (para os chips de filtro), + sementes
function etiquetasEmUso() {
  const set = new Set(ETIQ_SEED);
  lancamentos.forEach(l => (l.etiquetas || []).forEach(t => { if (!ETIQ_FIXVAR.includes(t)) set.add(t); }));
  return Array.from(set).sort((a, b) => a.localeCompare(b));
}

// ── Utilitários ───────────────────────────────────────────────────────────────

const TOAST_ICO = {
  '✅':'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:6px"><polyline points="20 6 9 17 4 12"/></svg>',
  '❌':'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:6px"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
  '⚠️':'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:6px"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
  '🗑️':'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#7a7d82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:6px"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>'
};
TOAST_ICO['⚠'] = TOAST_ICO['⚠️']; TOAST_ICO['🗑'] = TOAST_ICO['🗑️'];
function toast(msg, dur = 3000) {
  const t = document.getElementById('toast');
  let icon = '', text = String(msg == null ? '' : msg);
  for (const k in TOAST_ICO) { if (text.indexOf(k) === 0) { icon = TOAST_ICO[k]; text = text.slice(k.length).trim(); break; } }
  t.innerHTML = icon + '<span style="vertical-align:middle">' + text.replace(/</g,'&lt;') + '</span>';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}

function fmtMoeda(v) {
  return 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtCurInput(el) {
  let raw = el.value.replace(/[^\d,]/g, '');
  const parts = raw.split(',');
  let int = parts[0].replace(/^0+/, '') || '0';
  int = int.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  el.value = parts.length > 1 ? int + ',' + parts[1].slice(0, 2) : int;
}
function parseCur(val) {
  if (!val) return null;
  const num = parseFloat(String(val).replace(/\./g, '').replace(',', '.'));
  return isNaN(num) ? null : num;
}
function setCur(id, val) {
  const el = document.getElementById(id);
  if (!el) return;
  if (val == null || val === '') { el.value = ''; return; }
  const n = Number(val);
  el.value = isNaN(n) ? '' : n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtData(s) {
  if (!s) return '—';
  const [y, m, d] = s.split('-');
  return d + '/' + m + '/' + y;
}

function showTab(tab) {
  currentTab = tab;
  localStorage.setItem('fms_tab', tab);
  document.querySelectorAll('.subtab').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.subview').forEach(el => el.classList.remove('active'));
  document.getElementById('stab-' + tab).classList.add('active');
  document.getElementById('sv-' + tab).classList.add('active');
  document.getElementById('btnNovoLanc').style.display = tab === 'lanc' ? '' : 'none';
  document.getElementById('fmsToolsBtn')?.classList.toggle('active', ['metas', 'res', 'sim'].includes(tab));
  document.querySelectorAll('.sb-sub[data-tab]').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
  if (window.alexSetCrumb) window.alexSetCrumb('FMS', { dash:'Dashboard', lanc:'Lançamentos', importar:'Importar', fluxo:'Fluxo Mensal', cpr:'A Receber', saldos:'Saldos', dre:'DRE', metas:'Metas', res:'Reservas', sim:'Simulador', config:'Config' }[tab] || 'Dashboard');
  if (tab === 'dash')   renderDash();
  if (tab === 'lanc')   renderLanc();
  if (tab === 'importar') renderImportar();
  if (tab === 'fluxo')  renderFluxo();
  if (tab === 'cpr')    renderCPR();
  if (tab === 'saldos') renderSaldos();
  if (tab === 'dre')    renderDRE();
  if (tab === 'metas')  renderMetas();
  if (tab === 'res')    renderReservas();
  if (tab === 'sim')    renderSim();
  if (tab === 'config') renderConfig();
}

function toggleFmsTools(e) {
  e?.stopPropagation();
  document.getElementById('fmsToolsBtn').classList.toggle('open');
  document.getElementById('fmsToolsMenu').classList.toggle('open');
}
document.addEventListener('click', (e) => {
  const wrap = document.querySelector('.fmsd-tools');
  if (wrap && !wrap.contains(e.target)) {
    document.getElementById('fmsToolsBtn')?.classList.remove('open');
    document.getElementById('fmsToolsMenu')?.classList.remove('open');
  }
});

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  const savedTab = localStorage.getItem('fms_tab') || 'dash';
  // Mostra a aba salva imediatamente, antes de esperar o Supabase (evita o pulo de conteúdo)
  document.querySelectorAll('.subtab').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.subview').forEach(el => el.classList.remove('active'));
  document.getElementById('stab-' + savedTab)?.classList.add('active');
  document.getElementById('sv-' + savedTab)?.classList.add('active');
  document.getElementById('fmsToolsBtn')?.classList.toggle('active', ['metas', 'res', 'sim'].includes(savedTab));
  document.querySelectorAll('.sb-sub[data-tab]').forEach(el => el.classList.toggle('active', el.dataset.tab === savedTab));
  await initSupabase();
  await Promise.all([carregarLancamentos(), carregarConfig(), carregarJobsPendentes(), carregarSugestoesEtiqueta()]);
  verificarMigracao();
  showTab(savedTab);
}

async function carregarLancamentos() {
  const { data, error } = await db().from('lancamentos').select('*').order('data', { ascending: false });
  if (error) { console.error(error); return; }
  lancamentos = data || [];
}

async function carregarSugestoesEtiqueta() {
  try {
    const [c, j] = await Promise.all([
      db().from('imoveis_carteira').select('rua,numero').limit(300),
      db().from('jobs').select('cliente_nome').limit(300)
    ]);
    const extras = new Set();
    (c.data || []).forEach(x => { const e = [x.rua, x.numero].filter(Boolean).join(', '); if (e) extras.add(e); });
    (j.data || []).forEach(x => { if (x.cliente_nome) extras.add('Job ' + x.cliente_nome); });
    etiquetaExtras = Array.from(extras);
  } catch (e) { etiquetaExtras = []; }
}

// Fonte ÚNICA de "A Receber" (4.3): Dashboard e aba A Receber leem desta lista.
// Regra canônica: status Entregue ('feito') ou Não pago ('nao_pago'), com preço > 0.
async function carregarJobsPendentes() {
  const { data } = await db().from('jobs').select('id,tipo,cliente_nome,corretor,data,preco,servicos,rua,num,edificio,status,credito_para').in('status', ['feito','nao_pago']).order('data', { ascending: true });
  jobsPendentes = (data || []).filter(j => j.preco > 0);
}

async function carregarConfig() {
  const { data, error } = await db().from('categorias_fin').select('*').limit(1);
  if (error) { console.error(error); return; }
  if (data && data.length > 0) {
    finConfig = data[0].estrutura || { cats: {}, banks: [] };
    window._configId = data[0].id;
  }
}

async function salvarConfig() {
  const payload = { estrutura: finConfig, updated_at: new Date().toISOString() };
  if (window._configId) {
    const { error } = await db().from('categorias_fin').update(payload).eq('id', window._configId);
    if (error) { toast('❌ Erro: ' + error.message); return false; }
  } else {
    const { data, error } = await db().from('categorias_fin').insert(payload).select().single();
    if (error) { toast('❌ Erro: ' + error.message); return false; }
    window._configId = data.id;
  }
  return true;
}

// ── Render Lançamentos ────────────────────────────────────────────────────────
function renderLanc() {
  const el = document.getElementById('sv-lanc');
  const doMes = lancamentos.filter(l => {
    if (l.transferencia) return false;   // transferência não conta no resultado (4.10c)
    const parts = (l.data || '').split('-');
    return parseInt(parts[0]) === curYear && parseInt(parts[1]) - 1 === curMonth;
  });

  let lista = doMes;
  if (filtroTipo === 'receita') lista = doMes.filter(l => l.tipo === 'receita');
  if (filtroTipo === 'despesa') lista = doMes.filter(l => l.tipo === 'despesa');
  if (filtroEtiqueta) lista = lista.filter(l => (l.etiquetas || []).includes(filtroEtiqueta));

  const recTotal  = doMes.filter(l => l.tipo === 'receita').reduce((a, l) => a + Number(l.valor || 0), 0);
  const despTotal = doMes.filter(l => l.tipo === 'despesa').reduce((a, l) => a + Number(l.valor || 0), 0);
  const saldo = recTotal - despTotal;

  const nRec  = doMes.filter(l => l.tipo === 'receita').length;
  const nDesp = doMes.filter(l => l.tipo === 'despesa').length;

  // Barra de filtro por etiqueta
  const etqs = etiquetasEmUso();
  let etqBar = '<div class="etq-filter"><span class="lbl"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>Etiqueta:</span>'
    + '<span class="etq-fchip' + (!filtroEtiqueta ? ' on' : '') + '" onclick="setFiltroEtiqueta(\'\')">Todas</span>'
    + etqs.map(t => '<span class="etq-fchip' + (filtroEtiqueta === t ? ' on' : '') + '" onclick="setFiltroEtiqueta(\'' + impEsc(t).replace(/'/g, "\\'") + '\')">' + impEsc(t) + '</span>').join('')
    + '</div>';
  let etqTotal = '';
  if (filtroEtiqueta) {
    const g = lista.filter(l => l.tipo === 'despesa').reduce((a, l) => a + Number(l.valor || 0), 0);
    const r = lista.filter(l => l.tipo === 'receita').reduce((a, l) => a + Number(l.valor || 0), 0);
    etqTotal = '<div class="etq-total"><span class="k">Gasto com «<b>' + impEsc(filtroEtiqueta) + '</b>» (' + lista.length + ' lançamento' + (lista.length !== 1 ? 's' : '') + ')'
      + (r > 0 ? ' · entradas ' + fmtMoeda(r) : '') + '</span><span class="v">' + fmtMoeda(g) + '</span></div>';
  }

  el.innerHTML =
    '<div class="kpi-row">' +
      '<div class="kpi"><div class="kpi-label">Receitas</div><div class="kpi-val col-success">' + fmtMoeda(recTotal) + '</div><div class="kpi-sub">' + nRec + ' lançamento' + (nRec !== 1 ? 's' : '') + '</div></div>' +
      '<div class="kpi"><div class="kpi-label">Despesas</div><div class="kpi-val col-danger">'  + fmtMoeda(despTotal) + '</div><div class="kpi-sub">' + nDesp + ' lançamento' + (nDesp !== 1 ? 's' : '') + '</div></div>' +
      '<div class="kpi"><div class="kpi-label">Saldo</div><div class="kpi-val ' + (saldo >= 0 ? 'col-success' : 'col-danger') + '">' + fmtMoeda(saldo) + '</div><div class="kpi-sub">' + MONTHS[curMonth] + ' ' + curYear + '</div></div>' +
    '</div>' +
    '<div class="month-nav">' +
      '<button onclick="navMes(-1)">◀</button>' +
      '<div class="month-label">' + MONTHS[curMonth] + ' ' + curYear + '</div>' +
      '<button onclick="navMes(1)">▶</button>' +
    '</div>' +
    '<div class="tipo-filter">' +
      '<button onclick="setFiltro(\'all\')" class="' + (filtroTipo === 'all' ? 'f-all' : '') + '">Todos (' + doMes.length + ')</button>' +
      '<button onclick="setFiltro(\'receita\')" class="' + (filtroTipo === 'receita' ? 'f-rec' : '') + '">Receitas (' + nRec + ')</button>' +
      '<button onclick="setFiltro(\'despesa\')" class="' + (filtroTipo === 'despesa' ? 'f-desp' : '') + '">Despesas (' + nDesp + ')</button>' +
    '</div>' +
    etqBar + etqTotal +
    (lista.length === 0
      ? '<div class="empty-state"><div class="es-icon"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div><p>' + (filtroTipo === 'all' ? 'Nenhum lançamento neste mês.' : 'Nenhum lançamento deste tipo.') + '</p></div>'
      : '<div class="lanc-table-wrap"><table class="lanc-table"><thead><tr>' +
          '<th>Data</th><th>Descrição</th><th>Empresa / Categoria</th><th>Banco</th><th class="fms-td-r">Valor</th>' +
        '</tr></thead><tbody>' +
        lista.slice().sort((a, b) => b.data.localeCompare(a.data)).map(l =>
          '<tr onclick="openLancModal(\'' + l.id + '\')">' +
            '<td class="fms-td-date">' + fmtData(l.data) + '</td>' +
            '<td><span class="tipo-badge ' + (l.tipo === 'receita' ? 'rec">R' : 'desp">D') + '</span>' + (l.descricao || '—') + (l.cat ? '<br><span class="tag-sub" style="margin-left:26px">' + [l.cat, l.sub].filter(Boolean).join(' › ') + '</span>' : '') + ((l.etiquetas && l.etiquetas.length) ? '<br><span class="etq-row-tags">' + l.etiquetas.map(t => '<span class="t">' + impEsc(t) + '</span>').join('') + '</span>' : '') + '</td>' +
            '<td class="tag-sub">' + [l.conta, l.tipo ? (l.tipo === 'receita' ? 'Receita' : 'Despesa') : ''].filter(Boolean).join(' · ') + '</td>' +
            '<td class="tag-sub">' + (l.banco || '—') + '</td>' +
            '<td class="fms-td-r ' + (l.tipo === 'receita' ? 'val-rec' : 'val-desp') + '">' + (l.tipo === 'receita' ? '+' : '−') + fmtMoeda(l.valor) + '</td>' +
          '</tr>'
        ).join('') +
        '</tbody></table></div>'
    );

// ══ IMPORTADOR DE EXTRATOS (Fatia 4.10) ════════════════════════════════════════
// 4.10b: lê os arquivos, classifica, faz dedup e sugere — SEM gravar (botão desligado).
let impRows      = [];        // linhas lidas/classificadas
let impFiltro    = 'novos';   // novos | dup | transf | inv | tudo
let impBusca     = '';
let impEmpresaF  = 'all';

// Identificadores das contas próprias do Alex (transferência entre elas não conta)
const IMP_PROPRIOS = [
  '156.258',                 // CPF Alex (fragmento visível nos extratos)
  '43.532.008/0001-01',      // CNPJ Costa Fontes Corretora
  '43.532.008',              // CNPJ (fragmento)
  'ALEX CORREA DA COSTA FONTES',
  'COSTA FONTES',
  '14218304-5',              // Nubank PJ
  '679797-3', '6797979-3',   // Nubank PF (grafias vistas nos extratos)
  '186417-2',                // Bipa PF
  '351983-2'                 // Bipa PJ
];

function impNorm(s) {
  return (s || '').toString().toUpperCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '');  // tira acentos
}
function impIsProprio(texto) {
  const t = impNorm(texto);
  return IMP_PROPRIOS.some(p => t.includes(impNorm(p)));
}
// 'DD/MM/AAAA' ou 'DD/MM/AAAA HH:MM:SS' -> 'AAAA-MM-DD'
function impBrDate(s) {
  const m = (s || '').trim().match(/^(\d{2})\/(\d{2})\/(\d{4})/);
  return m ? (m[3] + '-' + m[2] + '-' + m[1]) : null;
}
// Quebra uma linha CSV respeitando aspas
function impSplitCsv(line) {
  const out = []; let cur = ''; let q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { if (q && line[i + 1] === '"') { cur += '"'; i++; } else q = !q; }
    else if (c === ',' && !q) { out.push(cur); cur = ''; }
    else cur += c;
  }
  out.push(cur);
  return out.map(x => x.trim());
}

// ── Leitura de cada formato ───────────────────────────────────────────────────
function impDetectAndParse(fileName, text) {
  const nome = impNorm(fileName);
  const head = (text.split(/\r?\n/)[0] || '');
  const headN = impNorm(head);
  // Nubank OFX
  if (impNorm(text).includes('<OFX>') || /\.OFX$/i.test(fileName)) {
    const banco = nome.includes('PF') ? 'Nubank PF' : 'Nubank PJ';
    return impParseNubankOfx(text, banco, fileName);
  }
  // Nubank CSV: Data,Valor,Identificador,Descrição
  if (headN.includes('IDENTIFICADOR') && headN.includes('VALOR')) {
    const banco = nome.includes('PF') ? 'Nubank PF' : 'Nubank PJ';
    return impParseNubankCsv(text, banco, fileName);
  }
  // Bipa Cartão (fatura): Data,Tipo,Titulo,Categoria,Valor_BRL — pote próprio "Bipa Cartão"
  if (headN.includes('VALOR_BRL') || (headN.includes('TITULO') && headN.includes('CATEGORIA'))) {
    return impParseBipaCartao(text, 'Bipa Cartão', fileName);
  }
  // Bipa BTC (arquivo-ativo) — fora do importador (decisão Alex). CHECAR ANTES da Conta:
  // o arquivo de BTC também tem Tipo_Transacao/E/S, mas só ele tem Ativo + Cotação.
  if (headN.includes('ATIVO') && (headN.includes('COTACAO') || headN.includes('QTD DE ATIVO'))) {
    return { erro: 'Arquivo de BTC (ativo) não entra no importador — fica para a futura área de Investimentos.' };
  }
  // Bipa Conta: Tipo_Transacao,E/S,Valor (R$),Origem,Destino,Data,Detalhes
  if (headN.includes('TIPO_TRANSACAO') && headN.includes('E/S')) {
    const banco = nome.includes('PJ') ? 'Bipa PJ' : 'Bipa PF';
    return impParseBipaConta(text, banco, fileName);
  }
  return { erro: 'Formato não reconhecido: ' + fileName };
}

function impParseNubankCsv(text, banco, fileName) {
  const linhas = text.split(/\r?\n/).filter(l => l.trim());
  const rows = [];
  for (let i = 1; i < linhas.length; i++) {
    const c = impSplitCsv(linhas[i]);
    if (c.length < 4) continue;
    const data = impBrDate(c[0]); if (!data) continue;
    const valor = parseFloat(c[1]);
    if (isNaN(valor)) continue;
    rows.push(impMakeRow({ data, valor, extId: c[2] || null, raw: c[3] || '', banco, fonte: 'Nubank' }));
  }
  return { banco, rows };
}

function impParseNubankOfx(text, banco, fileName) {
  const rows = [];
  const blocos = text.split(/<STMTTRN>/i).slice(1);
  for (const b of blocos) {
    const g = (tag) => { const m = b.match(new RegExp('<' + tag + '>([^<\\r\\n]*)', 'i')); return m ? m[1].trim() : ''; };
    const dt = g('DTPOSTED');
    const data = dt.length >= 8 ? (dt.slice(0, 4) + '-' + dt.slice(4, 6) + '-' + dt.slice(6, 8)) : null;
    const valor = parseFloat(g('TRNAMT'));
    if (!data || isNaN(valor)) continue;
    rows.push(impMakeRow({ data, valor, extId: g('FITID') || null, raw: g('MEMO') || g('NAME') || '', banco, fonte: 'Nubank' }));
  }
  // Saldo do banco que vem dentro do OFX (LEDGERBAL)
  let saldoBanco = null;
  const lb = text.match(/<LEDGERBAL>([\s\S]*?)<\/LEDGERBAL>/i) || text.match(/<LEDGERBAL>([\s\S]*?)(<STMTTRN>|<\/BANKTRANLIST>)/i);
  if (lb) {
    const bal = lb[1].match(/<BALAMT>([^<\r\n]+)/i);
    const asof = lb[1].match(/<DTASOF>([^<\r\n]+)/i);
    if (bal) {
      const v = parseFloat(bal[1]);
      const d = asof ? asof[1].trim() : '';
      saldoBanco = { saldo: isNaN(v) ? null : v, data: d.length >= 8 ? (d.slice(0, 4) + '-' + d.slice(4, 6) + '-' + d.slice(6, 8)) : null };
    }
  }
  return { banco, rows, saldoBanco };
}

function impParseBipaCartao(text, banco, fileName) {
  const linhas = text.split(/\r?\n/).filter(l => l.trim());
  const head = impSplitCsv(linhas[0]).map(impNorm);
  const iData = head.indexOf('DATA'), iTit = head.indexOf('TITULO'),
        iCat = head.findIndex(h => h.includes('CATEGORIA')), iVal = head.findIndex(h => h.includes('VALOR_BRL'));
  const rows = [];
  for (let i = 1; i < linhas.length; i++) {
    const c = impSplitCsv(linhas[i]);
    if (c.length < 3) continue;
    const data = impBrDate(c[iData]); if (!data) continue;
    const v = parseFloat((c[iVal] || '').replace(',', '.'));
    if (isNaN(v)) continue;
    rows.push(impMakeRow({
      data, valor: -Math.abs(v), extId: null, raw: c[iTit] || 'Compra cartão',
      banco, fonte: 'BipaCartao', hintCat: c[iCat] || ''
    }));
  }
  return { banco, rows };
}

function impParseBipaConta(text, banco, fileName) {
  const linhas = text.split(/\r?\n/).filter(l => l.trim());
  const head = impSplitCsv(linhas[0]).map(impNorm);
  const iTipo = head.indexOf('TIPO_TRANSACAO'), iES = head.indexOf('E/S'),
        iVal = head.findIndex(h => h.includes('VALOR')), iData = head.indexOf('DATA'),
        iDet = head.indexOf('DETALHES'), iDest = head.indexOf('DESTINO');
  const rows = [];
  for (let i = 1; i < linhas.length; i++) {
    const c = impSplitCsv(linhas[i]);
    if (c.length < 5) continue;
    const data = impBrDate(c[iData]); if (!data) continue;
    const v = parseFloat((c[iVal] || '').replace(',', '.'));
    if (isNaN(v)) continue;
    const entrada = impNorm(c[iES]).includes('ENTRADA');
    rows.push(impMakeRow({
      data, valor: entrada ? Math.abs(v) : -Math.abs(v), extId: null,
      raw: ((c[iTipo] || '') + (c[iDet] ? ' — ' + c[iDet] : '')).trim(),
      banco, fonte: 'BipaConta', bipaTipo: impNorm(c[iTipo]), destino: c[iDest] || ''
    }));
  }
  return { banco, rows };
}

// ── Monta a linha já classificada ─────────────────────────────────────────────
function impMakeRow(o) {
  const row = {
    data: o.data, valor: o.valor, extId: o.extId || null, raw: o.raw || '',
    banco: o.banco, fonte: o.fonte, hintCat: o.hintCat || '', bipaTipo: o.bipaTipo || '',
    natureza: 'despesa', transferencia: false, etiquetas: [],
    conta: 'Pessoal', cat: '', sub: '',
    dupDe: null, incluir: true, descricao: impCleanDesc(o.raw)
  };
  impClassificar(row);
  row.incluir = true;   // 4.12: transferências/investimentos também entram (alimentam o Saldo); duplicatas são desmarcadas no dedup
  impSugerir(row);
  return row;
}

// Natureza: despesa | receita | transferencia | investimento
function impClassificar(r) {
  const t = impNorm(r.raw);
  // Bipa pelos carimbos do próprio banco
  if (r.bipaTipo) {
    if (r.bipaTipo.includes('BTC') || r.bipaTipo.includes('BITCOIN')) {
      r.natureza = 'investimento'; r.transferencia = true;
      if (!r.etiquetas.includes('Investimento')) r.etiquetas.push('Investimento');
      return;
    }
    if (r.bipaTipo.includes('AUMENTO_LIMITE_CARTAO')) { r.natureza = 'transferencia'; r.transferencia = true; return; }
    if (r.bipaTipo.includes('DEPOSITO_REAIS'))        { r.natureza = 'transferencia'; r.transferencia = true; return; }
    if (r.bipaTipo.includes('PAGAMENTO_PIX')) {
      if (impIsProprio(r.raw) || impIsProprio(r.destino)) { r.natureza = 'transferencia'; r.transferencia = true; return; }
      r.natureza = r.valor >= 0 ? 'receita' : 'despesa'; return;
    }
  }
  // Compra no cartão pré-pago = despesa real
  if (r.fonte === 'BipaCartao') { r.natureza = 'despesa'; return; }
  // Nubank e demais: transferência entre contas próprias
  if (impIsProprio(r.raw)) { r.natureza = 'transferencia'; r.transferencia = true; return; }
  // Compra/Pix comum
  r.natureza = r.valor >= 0 ? 'receita' : 'despesa';
}

// Sugere empresa/categoria reaproveitando lançamentos passados parecidos
function impSugerir(r) {
  if (r.natureza === 'transferencia' || r.natureza === 'investimento') return;
  const chave = impMerchant(r.raw);
  if (chave) {
    const passado = lancamentos.find(l => l.descricao && impNorm(l.descricao).includes(chave) && l.cat);
    if (passado) {
      r.conta = passado.conta || r.conta;
      r.cat   = passado.cat || '';
      r.sub   = passado.sub || '';
      return;
    }
  }
}

// Extrai o "nome do estabelecimento" da descrição para casar com o passado
function impMerchant(raw) {
  let s = impNorm(raw);
  s = s.replace(/^COMPRA NO DEBITO\s*-\s*/, '')
       .replace(/^TRANSFERENCIA (ENVIADA|RECEBIDA)( PELO PIX)?\s*-\s*/, '')
       .replace(/^PAGAMENTO_PIX\s*—?\s*/, '');
  s = s.split(/\s[-—]\s|•|AGENCIA|CONTA:/)[0].trim();
  return s.length >= 3 ? s.slice(0, 24) : '';
}

// Descrição amigável (sem máscaras de CPF/conta); o texto cru completo vai pra Observação
function impCleanDesc(raw) {
  let s = (raw || '').replace(/[•]+\.?\d*\.?\d*-?[•]*/g, '').replace(/\s{2,}/g, ' ').trim();
  return s.length > 90 ? s.slice(0, 90) + '…' : s;
}

// ── Dedup: contra o que já está salvo + dentro do próprio lote ─────────────────
// Casa 1-pra-1: cada lançamento manual já salvo casa com no máximo UMA linha do
// extrato — assim 2 Zona Azul iguais no mesmo dia não viram ambas duplicata.
function impMarcarDuplicatas() {
  const vistosExt = new Set();
  const usados = new Set();   // ids de lançamentos manuais já casados nesta conferência
  for (const r of impRows) {
    r.dupDe = null; r.dupMatch = null;
    // 1) código único já salvo no banco
    if (r.extId) {
      const m = lancamentos.find(l => l.ext_id === r.extId);
      if (m) { r.dupDe = 'banco'; r.incluir = false; r.dupMatch = m; impAplicarMatch(r, m); continue; }
      if (vistosExt.has(r.extId)) { r.dupDe = 'lote'; r.incluir = false; continue; }
      vistosExt.add(r.extId);
    }
    // 2) heurística — só casa com lançamento MANUAL (sem código) ainda não usado
    const cand = lancamentos.find(l =>
      !l.ext_id && !usados.has(l.id) &&
      l.data === r.data &&
      Math.abs(Number(l.valor || 0) - Math.abs(r.valor)) < 0.005 &&
      l.banco === r.banco);
    if (cand) { r.dupDe = 'heuristica'; r.incluir = false; r.dupMatch = cand; usados.add(cand.id); impAplicarMatch(r, cand); }
  }
}
// Copia empresa/categoria do lançamento que casou (mostra o que você já tinha posto)
function impAplicarMatch(r, l) {
  if (r.natureza !== 'despesa' && r.natureza !== 'receita') return;
  if (l.conta) r.conta = l.conta;
  if (l.cat)   r.cat   = l.cat;
  r.sub = l.sub || '';
}

// ── Gravação (4.10c) ──────────────────────────────────────────────────────────
let impUltimoLote = null;   // {id, n, quando} da última importação — base do "desfazer"
let impSalvando   = false;

async function impSalvar() {
  if (impSalvando) return;
  const marcados = impRows.filter(r => r.incluir);
  if (!marcados.length) { toast('Nada marcado para importar'); return; }
  const semCat = marcados.filter(r => (r.natureza === 'despesa' || r.natureza === 'receita') && !r.cat);
  if (semCat.length && !confirm(semCat.length + ' lançamento(s) sem categoria vão entrar sem categoria. Continuar?')) return;

  impSalvando = true;
  const lote = 'imp_' + Date.now().toString(36);
  const payload = marcados.map(r => ({
    data:          r.data,
    descricao:     r.descricao || r.raw || 'Importado',
    valor:         Math.abs(r.valor),
    tipo:          r.valor >= 0 ? 'receita' : 'despesa',
    transferencia: (r.natureza === 'transferencia' || r.natureza === 'investimento'),
    conta:         r.conta || null,
    cat:           r.cat || null,
    sub:           r.sub || null,
    banco:         r.banco || null,
    obs:           r.raw || null,
    etiquetas:     (r.etiquetas && r.etiquetas.length) ? r.etiquetas : [],
    ext_id:        r.extId || null,
    import_lote:   lote,
    pago:          true,
    updated_at:    new Date().toISOString()
  }));

  let erro = null;
  for (let i = 0; i < payload.length; i += 50) {
    const { error } = await db().from('lancamentos').insert(payload.slice(i, i + 50));
    if (error) { erro = error; break; }
  }
  impSalvando = false;
  if (erro) { toast('❌ Erro ao importar: ' + erro.message); return; }

  impUltimoLote = { id: lote, n: payload.length, quando: new Date() };
  toast('✅ ' + payload.length + ' lançamentos importados');
  impRows = [];
  await carregarLancamentos();
  renderImportar();
}

async function impDesfazerLote() {
  if (!impUltimoLote) return;
  if (!confirm('Desfazer a última importação? Isso remove os ' + impUltimoLote.n + ' lançamentos desse lote.')) return;
  const { error } = await db().from('lancamentos').delete().eq('import_lote', impUltimoLote.id);
  if (error) { toast('❌ Erro ao desfazer: ' + error.message); return; }
  toast('↩️ Lote desfeito — ' + impUltimoLote.n + ' lançamentos removidos');
  impUltimoLote = null;
  await carregarLancamentos();
  renderImportar();
}

function impRenderRevisao() {
  const cont  = impRows.filter(r => r.natureza === 'despesa' || r.natureza === 'receita');
  const novos = cont.filter(r => !r.dupDe);
  const dups  = impRows.filter(r => r.dupDe);
  const transf= impRows.filter(r => r.natureza === 'transferencia');
  const inv   = impRows.filter(r => r.natureza === 'investimento');
  const marcados = impRows.filter(r => r.incluir).length;
  const soma = cont.filter(r => r.incluir).reduce((a, r) => a + r.valor, 0);

  // Se "Novos" está vazio (ex.: arquivo só de transferências), cai em "Tudo"
  if (impFiltro === 'novos' && novos.length === 0) impFiltro = 'tudo';

  // Filtro ativo
  let lista = impRows;
  if (impFiltro === 'novos')  lista = novos;
  if (impFiltro === 'dup')    lista = dups;
  if (impFiltro === 'transf') lista = transf;
  if (impFiltro === 'inv')    lista = inv;
  if (impBusca) { const b = impNorm(impBusca); lista = lista.filter(r => impNorm(r.descricao).includes(b)); }
  if (impEmpresaF !== 'all')  lista = lista.filter(r => r.conta === impEmpresaF);

  const seg = (k, txt, n) => '<span class="' + (impFiltro === k ? 'on' : '') + '" onclick="impSetFiltro(\'' + k + '\')">' + txt + ' (' + n + ')</span>';

  let h = '';
  h += '<div class="imp-sumbar">'
    + '<div class="imp-stat ok"><div class="k">Receita/Despesa</div><div class="v">' + cont.length + '</div></div>'
    + '<div class="imp-stat dup"><div class="k">Duplicatas</div><div class="v">' + dups.length + '</div></div>'
    + '<div class="imp-stat tr"><div class="k">Transferências</div><div class="v">' + transf.length + '</div></div>'
    + '<div class="imp-stat inv"><div class="k">Investimentos</div><div class="v">' + inv.length + '</div></div>'
    + '<div class="imp-stat"><div class="k">Soma (entra na conta)</div><div class="v">' + fmtMoeda(soma) + '</div></div>'
    + '</div>';

  h += '<div class="imp-tbar">'
    + '<div class="imp-seg">' + seg('novos', 'Novos', novos.length) + seg('dup', 'Duplicatas', dups.length) + seg('transf', 'Transferências', transf.length) + seg('inv', 'Investimentos', inv.length) + seg('tudo', 'Tudo', impRows.length) + '</div>'
    + '<select onchange="impEmpresaF=this.value;impRenderInplace()">'
    +   '<option value="all"' + (impEmpresaF === 'all' ? ' selected' : '') + '>Empresa: todas</option>'
    +   ['Pessoal', 'Pandora Homes', 'Pandora Foto Vídeo'].map(e => '<option' + (impEmpresaF === e ? ' selected' : '') + '>' + e + '</option>').join('')
    + '</select>'
    + '<input placeholder="Buscar na descrição…" value="' + (impBusca || '') + '" oninput="impBusca=this.value;impRenderInplace()">'
    + '</div>';

  if (!lista.length) {
    h += '<div class="imp-tablewrap"><div class="imp-empty">Nada neste filtro.</div></div>';
  } else {
    h += '<div class="imp-tablewrap"><table class="imp-table"><thead><tr>'
      + '<th></th><th>Data</th><th>Descrição</th><th style="text-align:right">Valor</th><th>Empresa</th><th>Categoria sugerida</th><th>Situação</th>'
      + '</tr></thead><tbody>';
    for (const r of lista) {
      const i = impRows.indexOf(r);
      const conta = (r.natureza === 'despesa' || r.natureza === 'receita');
      h += '<tr class="' + (r.incluir ? '' : 'off') + '">';
      h += '<td><input type="checkbox" class="imp-chk" ' + (r.incluir ? 'checked' : '') + ' onchange="impToggle(' + i + ')"></td>';
      h += '<td>' + fmtData(r.data) + '</td>';
      h += '<td><div class="imp-desc">' + impEsc(r.descricao || '—') + '</div><div class="imp-sub">' + r.banco + (r.dupDe ? ' · já existe no banco' : '') + '</div></td>';
      h += '<td class="imp-val ' + (r.valor < 0 ? 'neg' : 'pos') + '">' + (r.valor < 0 ? '−' : '+') + fmtMoeda(Math.abs(r.valor)).replace('R$ ', '') + '</td>';
      // Empresa
      if (conta) {
        h += '<td><select class="imp-mini emp" onchange="impSetEmpresa(' + i + ',this.value)">'
          + ['Pessoal', 'Pandora Homes', 'Pandora Foto Vídeo'].map(e => '<option' + (r.conta === e ? ' selected' : '') + '>' + e + '</option>').join('')
          + '</select></td>';
      } else { h += '<td><span class="imp-sub">não se aplica</span></td>'; }
      // Categoria
      if (conta) {
        h += '<td>' + impCatSelect(i, r) + '</td>';
      } else {
        const txt = r.natureza === 'investimento' ? 'Investimento (fora do DRE)' : 'não entra no DRE';
        h += '<td><span class="imp-sub">' + txt + '</span></td>';
      }
      // Situação
      let tag;
      if (r.dupDe)                              tag = '<span class="imp-tag dup">⊘ duplicata</span>';
      else if (r.natureza === 'transferencia')  tag = '<span class="imp-tag tr">⇄ transferência</span>';
      else if (r.natureza === 'investimento')   tag = '<span class="imp-tag inv">◆ investimento</span>';
      else                                      tag = '<span class="imp-tag new">● novo</span>';
      h += '<td>' + tag + '</td>';
      h += '</tr>';
    }
    h += '</tbody></table>';
    h += '<div class="imp-foot">'
      + '<span class="muted"><b>' + marcados + '</b> marcados para importar · ' + dups.length + ' duplicatas e transferências ficam de fora (dá pra marcar manualmente)</span>'
      + '<span class="imp-grow"></span>'
      + '<button class="btn btn-ghost btn-sm" onclick="impLimpar()">Limpar</button>'
      + '<button class="btn btn-primary btn-sm" onclick="impSalvar()">Importar ' + marcados + ' lançamento' + (marcados !== 1 ? 's' : '') + '</button>'
      + '</div>';
    h += '</div>';
  }

  h += '<div class="imp-legend">'
    + '<span><span class="imp-tag new">● novo</span> entra como lançamento</span>'
    + '<span><span class="imp-tag dup">⊘ duplicata</span> já existe — desmarcado</span>'
    + '<span><span class="imp-tag tr">⇄ transferência</span> salvo p/ saldo, fora do DRE</span>'
    + '<span><span class="imp-tag inv">◆ investimento</span> BTC + etiqueta "Investimento"</span>'
    + '</div>';
  return h;
}

// Categoria em dois campos encadeados (Categoria → Subcategoria) — listas curtas
function impCatSelect(i, r) {
  const grp  = r.natureza === 'receita' ? 'Receita' : 'Despesa';
  const tree = (((finConfig.cats || {})[r.conta] || {})[grp]) || {};
  const cats = Object.keys(tree);
  let catSel = '<select class="imp-mini" onchange="impSetCat(' + i + ',this.value)">'
    + '<option value="">(categoria)</option>'
    + cats.map(c => '<option' + (r.cat === c ? ' selected' : '') + '>' + impEsc(c) + '</option>').join('')
    + '</select>';
  const subs = (tree[r.cat] || []);
  let subSel;
  if (subs.length) {
    subSel = ' <select class="imp-mini" onchange="impSetSub(' + i + ',this.value)">'
      + '<option value="">(sub)</option>'
      + subs.map(s => '<option' + (r.sub === s ? ' selected' : '') + '>' + impEsc(s) + '</option>').join('')
      + '</select>';
  } else {
    // Sempre mostra o 2º campo (desabilitado) para a linha não mudar de cara
    subSel = ' <select class="imp-mini" disabled><option>' + (r.cat ? '(sem sub)' : '(sub)') + '</option></select>';
  }
  return catSel + subSel;
}

function impEsc(s) { return (s || '').toString().replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

// Re-render só a parte de revisão (mantém o foco/scroll melhor que recriar tudo)
function impRenderInplace() { renderImportar(); }

// ── Eventos ───────────────────────────────────────────────────────────────────
function impSetFiltro(k) { impFiltro = k; renderImportar(); }
function impToggle(i)    { if (impRows[i]) impRows[i].incluir = !impRows[i].incluir; renderImportar(); }
function impSetEmpresa(i, v) { if (!impRows[i]) return; impRows[i].conta = v; impRows[i].cat = ''; impRows[i].sub = ''; impSugerir(impRows[i]); renderImportar(); }
function impSetCat(i, v) {
  if (!impRows[i]) return;
  const r = impRows[i];
  r.cat = v; r.sub = '';
  renderImportar();
}
function impSetSub(i, v) { if (impRows[i]) impRows[i].sub = v; renderImportar(); }
function impLimpar() { impRows = []; renderImportar(); }

function impDragOver(e)  { e.preventDefault(); document.getElementById('impDrop')?.classList.add('over'); }
function impDragLeave(e) { e.preventDefault(); document.getElementById('impDrop')?.classList.remove('over'); }
function impDrop(e)      { e.preventDefault(); document.getElementById('impDrop')?.classList.remove('over'); impOnFiles(e.dataTransfer.files); }

async function impOnFiles(fileList) {
  const files = Array.from(fileList || []);
  if (!files.length) return;
  let lidos = 0, erros = [], capturouSaldo = false;
  for (const f of files) {
    try {
      const text = await f.text();
      const res = impDetectAndParse(f.name, text);
      if (res.erro) { erros.push(res.erro); continue; }
      const rows2026 = (res.rows || []).filter(r => (r.data || '').slice(0, 4) === '2026');
      impRows = impRows.concat(rows2026);
      lidos += rows2026.length;
      // OFX do Nubank traz o saldo do banco — guarda na config
      if (res.saldoBanco && res.saldoBanco.saldo != null) {
        sdSetCampo(res.banco, 'banco', res.saldoBanco.saldo, res.saldoBanco.data);
        capturouSaldo = true;
      }
    } catch (err) { erros.push('Erro lendo ' + f.name + ': ' + err.message); }
  }
  if (capturouSaldo) await salvarConfig();
  impMarcarDuplicatas();
  renderImportar();
  if (erros.length) toast('⚠️ ' + erros[0]);
  else toast('✅ ' + lidos + ' linhas lidas' + (capturouSaldo ? ' · saldo do banco capturado' : ''));
}

// ══ SALDOS (Fatia 4.12) ════════════════════════════════════════════════════════
const SD_CONTAS = ['Nubank PF', 'Nubank PJ', 'Bipa PF', 'Bipa PJ', 'Bipa Cartão'];  // Regina não é conta própria
let sdEdit = null;

function sdSaldosCfg() { if (!finConfig.saldos) finConfig.saldos = {}; return finConfig.saldos; }
function sdCfg(conta) {
  const s = sdSaldosCfg();
  if (!s[conta]) s[conta] = { inicial: null, inicial_data: null, banco: null, banco_data: null };
  return s[conta];
}
function sdSetCampo(conta, campo, valor, data) {
  const c = sdCfg(conta);
  if (campo === 'inicial') { c.inicial = valor; c.inicial_data = data || null; }
  if (campo === 'banco')   { c.banco = valor;   c.banco_data = data || null; }
}

// Saldo calculado = inicial + tudo que entrou/saiu da conta desde a data inicial (inclui transferências)
function sdCalcular(conta) {
  const c = sdCfg(conta);
  if (conta === 'Bipa Cartão') return sdCalcularCartaoBipa(c);
  if (c.inicial == null || !c.inicial_data) return null;
  let s = Number(c.inicial);
  lancamentos.forEach(l => {
    if (l.banco !== conta) return;
    if ((l.data || '') < c.inicial_data) return;
    s += (l.tipo === 'receita' ? 1 : -1) * Number(l.valor || 0);
  });
  return s;
}

// Cartão pré-pago Bipa: (inicial||0) + recargas (AUMENTO_LIMITE_CARTAO) − compras (banco "Bipa Cartão")
function sdCalcularCartaoBipa(c) {
  const desde = c.inicial_data || '0000-00-00';
  let s = (c.inicial == null) ? 0 : Number(c.inicial);
  lancamentos.forEach(l => {
    if ((l.data || '') < desde) return;
    const recarga = l.obs && impNorm(l.obs).indexOf('AUMENTO_LIMITE_CARTAO') >= 0;
    if (recarga) { s += Number(l.valor || 0); return; }            // carregou: entra no cartão
    if (l.banco === 'Bipa Cartão') s -= Number(l.valor || 0);      // comprou: sai do cartão
  });
  return s;
}

// Dívida com Regina = gastos no cartão dela − pagamentos (lançados como entrada nesse banco)
function sdReginaDevido() {
  let s = 0;
  lancamentos.forEach(l => {
    if (l.banco !== 'Regina Débito') return;
    s += (l.tipo === 'receita' ? -1 : 1) * Number(l.valor || 0);
  });
  return s;
}

      else                      diff = '<span class="sd-diff bad"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;margin-right:3px"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>Sobra ' + fmtMoeda(d) + '</span>';
    } else                      diff = '<span class="sd-diff none">informe o saldo p/ comparar</span>';

    cards += '<div class="sd-acct">'
      + '<div class="sd-h"><div class="sd-ico ' + (isCard ? 'bipa' : (isNu ? 'nu' : 'bipa')) + '">' + ico + '</div>'
      +   '<div><div class="sd-nome">' + conta + '</div><div class="sd-tag">' + tag + '</div></div></div>'
      + '<div class="sd-saldo">' + (calc == null ? '—' : fmtMoeda(calc)) + '</div>'
      + diff
      + '<div class="sd-rows">'
      +   '<div class="sd-row"><span class="k">Calculado pelo sistema</span><span class="v">' + (calc == null ? '—' : fmtMoeda(calc)) + '</span></div>'

      +   '<div class="sd-row"><span class="k">Saldo inicial' + (c.inicial_data ? ' (' + fmtData(c.inicial_data) + ')' : '') + '</span><span class="v">' + (c.inicial == null ? '—' : fmtMoeda(c.inicial)) + '</span></div>'

  const reg = sdReginaDevido();
  el.innerHTML = ''
    + '<div class="sd-total"><div><div class="lbl">Saldo total (suas contas)</div><div class="v">' + (temAlgum ? fmtMoeda(total) : '—') + '</div></div>'
    +   '<div class="sub">Nubank PF/PJ + Bipa PF/PJ · não inclui Regina</div></div>'
    + '<div class="sd-cards">' + cards + '</div>'
    + '<div class="sd-regina"><div class="v">' + fmtMoeda(reg) + '</div>'
    +   '<div class="txt"><b>Dívida com Regina (sua mãe)</b> — total gasto no cartão dela menos o que você já devolveu. '
    +   'Para abater, lance o pagamento como <b>entrada (receita)</b> no banco "Regina Débito".</div></div>'
    + '<div class="sd-help">O saldo calculado usa o <b>saldo inicial</b> + todos os movimentos da conta (inclusive transferências) — só fica certo depois que os extratos do período estiverem importados. '
    +   'Saldo do banco: no <b>Nubank</b> eu puxo do arquivo OFX ao importar; na <b>Bipa</b>, você informa (está na tela inicial da conta no app).</div>';
}

function sdAbrir(conta, campo) {
  sdEdit = { conta, campo };
  const c = sdCfg(conta);
  document.getElementById('sdModalTitulo').textContent = (campo === 'inicial' ? 'Saldo inicial' : 'Saldo no banco') + ' — ' + conta;
  setCur('sdValor', campo === 'inicial' ? c.inicial : c.banco);
  document.getElementById('sdData').value = (campo === 'inicial' ? c.inicial_data : c.banco_data) || todayStr();
  document.getElementById('sdHint').textContent = campo === 'inicial'
    ? 'Quanto a conta tinha na data abaixo. O sistema soma os movimentos a partir dela.'
    : 'O saldo que o banco mostra hoje, para comparar com o calculado.';
  document.getElementById('sdOverlay').classList.add('open');
  setTimeout(() => { const elv = document.getElementById('sdValor'); if (elv) elv.focus(); }, 50);
}
function sdFechar() { document.getElementById('sdOverlay').classList.remove('open'); sdEdit = null; }
async function sdSalvar() {
  if (!sdEdit) return;
  const valor = parseCur(document.getElementById('sdValor').value);
  const data = document.getElementById('sdData').value || null;
  if (valor == null) { toast('⚠️ Informe um valor'); return; }
  sdSetCampo(sdEdit.conta, sdEdit.campo, valor, data);
  const ok = await salvarConfig();
  if (ok === false) return;
  toast('✅ Saldo atualizado');
  sdFechar();
  renderSaldos();
}

    populateContaSelect(l.conta);

function renderLancTagsUI() {
  const box = document.getElementById('fTagsBox');
  if (box) box.innerHTML = lancTags.length
    ? lancTags.map((t, i) => '<span class="etq-chip">' + impEsc(t) + ' <span class="x" onclick="lancRemoveTag(' + i + ')">×</span></span>').join('')
    : '<span class="config-empty-sub">nenhuma etiqueta</span>';
  const dl = document.getElementById('fTagList');
  if (dl) dl.innerHTML = etiquetaSugestoes().filter(t => !lancTags.includes(t)).map(t => '<option value="' + impEsc(t) + '">').join('');
  const seg = document.getElementById('fFixVar');
  if (seg) seg.innerHTML = ['Fixo', 'Variável', '—'].map(v => {
    const val = v === '—' ? '' : v;
    return '<span class="' + (lancFixVar === val ? 'on' : '') + '" onclick="lancSetFixVar(\'' + val + '\')">' + v + '</span>';
  }).join('');
}
function lancTagKey(e) {
  if (e.key === 'Enter') { e.preventDefault(); lancAddTag(e.target.value); e.target.value = ''; }
}
function lancAddTag(v) {
  const t = (v || '').trim();
  if (!t || lancTags.includes(t) || ETIQ_FIXVAR.includes(t)) return;
  lancTags.push(t);
  renderLancTagsUI();
}
function lancRemoveTag(i) { lancTags.splice(i, 1); renderLancTagsUI(); }
function lancSetFixVar(v) { lancFixVar = (lancFixVar === v) ? '' : v; renderLancTagsUI(); }
