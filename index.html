<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Alex OS</title>
  <link rel="stylesheet" href="css/base.css?v=20260713h">
  <style>
    .login-wrap {
      flex: 1;
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-card {
      width: 340px;
      max-width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px 28px;
    }
    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }
    .login-logo { width: 46px; height: 46px; }
    .login-logo path { fill: var(--accent); }
    .login-name {
      font-family: var(--font-brand);
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: .5px;
    }
    .login-name em { font-style: normal; color: var(--accent); }
    .login-sub { font-size: 12px; color: var(--muted); margin-top: -6px; }
    .login-field { margin-bottom: 14px; }
    .login-label {
      display: block;
      font-family: var(--font-brand);
      font-size: 11px;
      color: var(--muted);
      letter-spacing: .4px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    .login-input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 11px;
      transition: border-color .15s;
    }
    .login-input-row:focus-within { border-color: var(--accent); }
    .login-input-row svg { width: 17px; height: 17px; color: var(--muted); flex: none; }
    .login-input-row input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 14px;
      padding: 10px 0;
    }
    .login-eye {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 4px;
      display: flex;
    }
    .login-eye svg { width: 17px; height: 17px; }
    .login-btn {
      width: 100%;
      background: var(--accent);
      color: #fff;
      font-family: var(--font-brand);
      font-weight: 700;
      font-size: 14px;
      border: none;
      border-radius: 8px;
      padding: 12px;
      cursor: pointer;
      margin-top: 6px;
      transition: background .15s, opacity .15s;
    }
    .login-btn:hover { background: var(--accent-dark); }
    .login-btn:disabled { opacity: .6; cursor: default; }
    .login-error {
      display: none;
      align-items: center;
      gap: 6px;
      justify-content: center;
      font-size: 12px;
      color: var(--danger);
      margin-top: 14px;
    }
    .login-error.show { display: flex; }
    .login-error svg { width: 15px; height: 15px; }
    .login-foot {
      text-align: center;
      font-size: 10px;
      color: var(--muted);
      opacity: .7;
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" id="loginForm" autocomplete="on" style="visibility:hidden">
      <div class="login-brand">
        <svg class="login-logo" viewBox="0 0 585.31 585.31" xmlns="http://www.w3.org/2000/svg" aria-label="Pandora Homes">
          <path d="M0,36.63v512.04l48.47-19.64V56.21L0,36.63ZM536.89,56.21v472.83l48.42,19.64V36.63l-48.42,19.58ZM56.27,536.84l-19.64,48.47h512.04l-19.58-48.47H56.27ZM36.63,0l19.64,48.42h472.83L548.68,0H36.63Z"/>
          <path d="M311.64,118.15h-124.49v46.17h124.1c48.47,0,77.87,25.75,77.87,70.07s-29.4,71.19-77.87,71.19h-124.1v171.45h54.81v-125.22h69.68c80.51,0,132.29-42.47,132.29-117.76s-51.78-115.91-132.29-115.91Z"/>
        </svg>
        <span class="login-name">Alex <em>OS</em></span>
        <span class="login-sub">Gestão operacional</span>
      </div>

      <div class="login-field">
        <label class="login-label" for="loginEmail">E-mail</label>
        <div class="login-input-row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
          <input type="email" id="loginEmail" name="email" autocomplete="username" placeholder="seu@email.com" required>
        </div>
      </div>

      <div class="login-field">
        <label class="login-label" for="loginPass">Senha</label>
        <div class="login-input-row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="loginPass" name="password" autocomplete="current-password" placeholder="••••••••" required>
          <button type="button" class="login-eye" id="loginEye" aria-label="Mostrar/ocultar senha">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <button type="submit" class="login-btn" id="loginBtn">Entrar</button>

      <div class="login-error" id="loginError">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="loginErrorMsg">E-mail ou senha incorretos</span>
      </div>

      <div class="login-foot">Acesso restrito · Alex Fontes</div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js?v=20260706c"></script>
  <script>
    const form = document.getElementById('loginForm');
    const emailEl = document.getElementById('loginEmail');
    const passEl = document.getElementById('loginPass');
    const btn = document.getElementById('loginBtn');
    const errBox = document.getElementById('loginError');
    const errMsg = document.getElementById('loginErrorMsg');
    const eye = document.getElementById('loginEye');

    eye.addEventListener('click', function () {
      passEl.type = passEl.type === 'password' ? 'text' : 'password';
    });

    function showError(msg) {
      errMsg.textContent = msg;
      errBox.classList.add('show');
    }

    (async function boot() {
      const sb = await initSupabase();
      // Já logado? Vai direto pro Dash.
      const { data: { session } } = await sb.auth.getSession();
      if (session) { location.replace('hoje.html'); return; }
      form.style.visibility = '';
      emailEl.focus();

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        errBox.classList.remove('show');
        btn.disabled = true;
        btn.textContent = 'Entrando…';
        const { error } = await sb.auth.signInWithPassword({
          email: emailEl.value.trim(),
          password: passEl.value
        });
        if (error) {
          const m = (error.message || '').toLowerCase();
          showError(m.includes('confirm')
            ? 'E-mail ainda não confirmado.'
            : 'E-mail ou senha incorretos.');
          btn.disabled = false;
          btn.textContent = 'Entrar';
          passEl.focus();
          passEl.select();
          return;
        }
        location.replace('hoje.html');
      });
    })();
  </script>
</body>
</html>
